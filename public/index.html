<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="Buisder - swipe-friendly job matching for young people. Apply to local jobs in seconds." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2210%22 fill=%22%237c3aed%22/><text x=%2250%25%22 y=%2262%25%22 font-size=%2258%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22900%22 text-anchor=%22middle%22>B</text></svg>" />
  <title>Buisder - Swipe Prototype</title>
  <style>
    :root{
      --ink:#181814;
      --panel:#211f19;
      --paper:#f5f2ea;
      --paper-dim:#eae5d8;
      --text:#181814;
      --muted:#8a8477;
      --muted-on-dark:#a39c8c;
      --line-dark:rgba(245,242,234,.14);
      --line-light:#ddd6c4;
      --accent:#c1531f;
      --accent-ink:#7a3512;
      --accent-tint:#f4e2d4;
      --good:#3d6b46;
      --good-tint:#e4ede2;
      --bad:#a63a2c;
      --bad-tint:#f4e2dd;
      --radius:10px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--paper)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{
      width:min(100%,430px);
      min-height:100vh;
      margin:0 auto;
      position:relative;
      background:var(--ink);
      overflow:hidden;
    }
    .topbar{
      position:sticky;top:0;z-index:30;
      padding:14px 16px 10px;
      background:var(--ink);
      border-bottom:1px solid var(--line-dark);
    }
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
    .logo{
      width:36px;height:36px;border-radius:8px;background:var(--accent);
      display:grid;place-items:center;font-weight:700;color:var(--paper)
    }
    .subtle{font-size:12px;color:var(--muted-on-dark)}
    .modepill{
      display:flex;background:transparent;padding:3px;border-radius:10px;border:1px solid var(--line-dark)
    }
    .modepill button{
      border:0;background:transparent;color:var(--muted-on-dark);padding:8px 10px;border-radius:7px;font-size:12px;font-weight:600
    }
    .modepill button.active{background:var(--paper);color:var(--ink)}
    main{padding-bottom:92px}
    .hidden{display:none!important}
    .hero{
      margin:16px;background:var(--accent);
      border-radius:12px;padding:20px
    }
    .hero h1{margin:0 0 10px;font-size:26px;line-height:1.1;letter-spacing:-.02em;font-weight:700}
    .hero p{margin:0;color:var(--accent-tint);font-size:14px;line-height:1.5}
    .cta-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
    .btn{
      border:0;border-radius:8px;padding:12px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px
    }
    .btn-dark{background:var(--panel);color:var(--paper);border:1px solid var(--line-dark)}
    .btn-light{background:var(--paper);color:var(--ink)}
    .btn-soft{background:rgba(245,242,234,.14);color:var(--paper)}
    .btn-good{background:var(--good-tint);color:var(--good)}
    .btn-bad{background:var(--bad-tint);color:var(--bad)}
    .btn-outline{background:transparent;border:1px solid var(--line-dark);color:var(--paper)}
    .btn-block{width:100%}
    .section-pad{padding:0 16px}
    .title-row{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:18px 0 10px}
    .title-row h2{margin:0;font-size:17px;letter-spacing:-.01em;font-weight:700}
    .title-row span{font-size:12px;color:var(--muted-on-dark)}
    .card{
      background:var(--paper);color:var(--text);border-radius:var(--radius);padding:16px;border:1px solid var(--line-light)
    }
    .card.dark{
      background:var(--panel);color:var(--paper);border:1px solid var(--line-dark)
    }
    .small{font-size:12px;color:var(--muted)}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
    .chip{
      padding:7px 10px;border-radius:8px;background:var(--paper-dim);font-size:12px;font-weight:600;color:#4b4638
    }
    .chip.dark{background:rgba(245,242,234,.1);color:var(--paper);border:1px solid var(--line-dark)}
    .chip.good{background:var(--good-tint);color:var(--good)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .stat{
      background:var(--panel);border:1px solid var(--line-dark);border-radius:10px;padding:14px;text-align:center
    }
    .stat strong{display:block;font-size:19px;font-weight:700}
    .stat span{font-size:11px;color:var(--muted-on-dark)}
    .feed-wrap{padding:10px 16px 110px}
    .feed-intro{
      display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px
    }
    .feed-intro h2{margin:0;font-size:17px;font-weight:700}
    .feed-intro .hint{font-size:12px;color:var(--muted-on-dark)}
    .feed{
      position:relative;
      min-height:72vh;
    }
    .job-card{
      position:relative;
      width:100%;
      min-height:72vh;
      border-radius:12px;
      overflow:hidden;
      border:1px solid var(--line-light);
      background:var(--paper);
      color:var(--ink);
      touch-action:pan-y;
      user-select:none;
      transition:transform .25s ease, opacity .25s ease;
    }
    .job-image{
      min-height:30vh;
      padding:18px;
      color:var(--paper);
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      background:var(--ink);
      border-bottom:1px solid var(--line-dark);
    }
    .job-badge{
      display:inline-flex;align-self:flex-start;
      background:transparent;
      border:1px solid var(--line-dark);
      color:var(--paper);padding:6px 10px;border-radius:7px;font-size:11px;font-weight:600;
    }
    .job-image h3{margin:10px 0 4px;font-size:26px;line-height:1.1;letter-spacing:-.01em;font-weight:700}
    .job-image p{margin:0;color:var(--muted-on-dark)}
    .job-body{padding:18px}
    .grid{
      display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0
    }
    .metric{
      border:1px solid var(--line-light);
      border-radius:8px;
      padding:12px;
      background:var(--paper-dim)
    }
    .metric small{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
    .metric strong{font-size:14px}
    .why{
      background:var(--accent-tint);border-radius:10px;padding:13px;font-size:13px;line-height:1.5;color:var(--accent-ink)
    }
    .swipe-overlay{
      position:absolute;top:18px;z-index:2;padding:9px 14px;border-radius:7px;font-size:14px;
      font-weight:700;letter-spacing:.03em;opacity:0;transition:opacity .12s ease;
      border:2px solid transparent
    }
    .swipe-like{right:18px;background:var(--good-tint);color:var(--good);border-color:var(--good)}
    .swipe-nope{left:18px;background:var(--bad-tint);color:var(--bad);border-color:var(--bad)}
    .swipe-actions{
      display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px
    }
    .big-action{padding:14px 12px;border-radius:8px;border:0;font-weight:600}
    .skip{background:var(--bad-tint);color:var(--bad)}
    .details{background:var(--ink);color:var(--paper)}
    .accept{background:var(--good-tint);color:var(--good)}
    .feed-progress{
      display:flex;gap:6px;margin:12px 0 4px
    }
    .feed-progress span{
      flex:1;height:3px;border-radius:3px;background:var(--line-dark)
    }
    .feed-progress span.active{background:var(--accent)}
    .info-note{
      margin-top:12px;font-size:12px;color:var(--muted-on-dark);line-height:1.4
    }
    .list-card{margin-bottom:12px}
    .app-item{
      display:flex;align-items:center;justify-content:space-between;gap:12px
    }
    .pill{
      padding:6px 10px;border-radius:7px;font-size:11px;font-weight:600
    }
    .pill.good{background:var(--good-tint);color:var(--good)}
    .pill.soft{background:var(--accent-tint);color:var(--accent-ink)}
    .bottomnav{
      position:fixed;bottom:0;left:50%;transform:translateX(-50%);
      width:min(100%,430px);
      background:var(--ink);
      border-top:1px solid var(--line-dark);
      padding:8px 8px calc(8px + env(safe-area-inset-bottom));
      display:grid;grid-template-columns:repeat(4,1fr);z-index:40
    }
    .bottomnav button{
      border:0;border-top:2px solid transparent;background:transparent;color:var(--muted-on-dark);padding:10px 4px 6px;font-size:12px;font-weight:600
    }
    .bottomnav button.active{color:var(--paper);border-top-color:var(--accent)}
    .modal{
      position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:70
    }
    .sheet{
      width:min(100%,430px);background:var(--paper);color:var(--ink);border-radius:14px 14px 0 0;padding:20px;max-height:84vh;overflow:auto;border-top:1px solid var(--line-light)
    }
    .handle{width:40px;height:4px;border-radius:3px;background:var(--line-light);margin:0 auto 16px}
    .sheet h3{margin:0 0 8px;font-size:22px;letter-spacing:-.01em;font-weight:700}
    .sheet p{color:#565244;line-height:1.5}
    .toast{
      position:fixed;left:50%;transform:translateX(-50%);bottom:98px;background:var(--ink);color:var(--paper);
      border-radius:8px;padding:11px 15px;font-size:12px;font-weight:600;border:1px solid var(--line-dark);z-index:90
    }
    .empty{
      padding:30px 18px;text-align:center
    }
    .form-card{
      background:var(--paper);color:var(--ink);border-radius:10px;padding:16px;border:1px solid var(--line-light)
    }
    label{display:block;font-size:12px;font-weight:600;margin:12px 0 6px;color:#4b4638}
    input,select,textarea{
      width:100%;border:1px solid var(--line-light);border-radius:8px;padding:12px;background:#fff;color:var(--ink);outline:none
    }
    input:focus,select:focus,textarea:focus{border-color:var(--accent)}
    .notice{
      background:var(--paper-dim);border-radius:8px;padding:12px;font-size:12px;line-height:1.5;color:#565244;margin-top:12px
    }
    .interview-alert{
      background:var(--accent-tint);color:var(--accent-ink);border:1px solid #d7b19b;
      border-radius:10px;padding:14px;margin-bottom:12px
    }
    .interview-alert strong{display:block;margin-bottom:4px}
    .notify-btn{margin-top:10px;background:#fff;color:#111827;border:0;border-radius:12px;padding:10px 12px;font-weight:900}
    .interview-box{
      background:var(--good-tint);color:#294d30;border:1px solid #b8ccb9;
      border-radius:10px;padding:13px;margin:12px 0
    }
    .interview-box.pending{background:var(--accent-tint);color:var(--accent-ink);border-color:#d7b19b}
    .interview-box.declined{background:var(--bad-tint);color:var(--bad);border-color:#d9aaa1}
    .new-dot{
      display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;
      border-radius:9px;background:var(--accent);color:var(--paper);font-size:10px;margin-left:4px;padding:0 5px
    }
    @media (min-width:700px){
      body{padding:24px 0}
      .app{border-radius:14px;border:1px solid var(--line-dark);min-height:calc(100vh - 48px)}
      .bottomnav{bottom:24px;border-radius:0 0 14px 14px}
    }
  
    .profile-avatar{
      width:88px;height:88px;border-radius:50%;overflow:hidden;
      background:#eef2ff;color:#3730a3;display:grid;place-items:center;
      font-size:30px;font-weight:900;border:3px solid #fff;
      box-shadow:0 8px 24px rgba(17,24,39,.12);margin:0 auto 12px;
    }
    .profile-avatar img{width:100%;height:100%;object-fit:cover}
    .onboarding-banner{
      background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;
      border-radius:16px;padding:12px;margin:12px 0;font-size:13px;line-height:1.45
    }
    

    .jobseeker-photo{width:96px;height:96px;border-radius:50%;overflow:hidden;background:#eef2ff;color:#3730a3;display:grid;place-items:center;font-size:32px;font-weight:900;border:3px solid #fff;box-shadow:0 8px 24px rgba(17,24,39,.12);margin:0 auto 10px}
    .jobseeker-photo img{width:100%;height:100%;object-fit:cover}
    .photo-help{text-align:center;color:#667085;font-size:12px;margin:0 0 12px}
    .applicant-photo{width:50px;height:50px;border-radius:50%;overflow:hidden;background:#eef2ff;color:#3730a3;display:grid;place-items:center;font-weight:900;flex:0 0 auto}
    .applicant-photo img{width:100%;height:100%;object-fit:cover}


    .filter-bar{background:var(--panel);border:1px solid var(--line-dark);border-radius:10px;padding:10px 12px;margin-bottom:12px}
    .filter-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .filter-summary{font-size:12px;color:var(--muted-on-dark);line-height:1.35}
    .filter-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .filter-chip{font-size:11px;padding:5px 7px;border-radius:7px;background:rgba(245,242,234,.1);border:1px solid var(--line-dark);color:var(--paper)}
    .match-score{font-size:12px;font-weight:700;color:var(--good);background:var(--good-tint);padding:6px 8px;border-radius:7px}
    .geo-status{font-size:12px;color:var(--muted);margin-top:6px}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}


    .business-logo{
      width:84px;height:84px;border-radius:18px;overflow:hidden;
      background:#eef2ff;color:#3730a3;display:grid;place-items:center;
      font-size:28px;font-weight:900;border:1px solid var(--line);
      margin:0 auto 12px;
    }
    .business-logo img{width:100%;height:100%;object-fit:cover}
    .verification-card{
      border-radius:14px;padding:13px;margin:12px 0;
      border:1px solid var(--line);background:#f8fafc;color:#344054;
    }
    .verification-card.verified{background:#ecfdf3;color:#067647;border-color:#abefc6}
    .verification-card.pending{background:#fffaeb;color:#b54708;border-color:#fedf89}
    .verification-card.rejected{background:#fef3f2;color:#b42318;border-color:#fecdca}
    .verified-badge{
      display:inline-flex;align-items:center;gap:5px;
      border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;
      background:#ecfdf3;color:#067647;border:1px solid #abefc6;
    }
    .unverified-badge{
      display:inline-flex;align-items:center;gap:5px;
      border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;
      background:#f2f4f7;color:#667085;border:1px solid #e4e7ec;
    }


    .admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
    .admin-stat{background:#fff;color:#101828;border-radius:18px;padding:15px;border:1px solid #e4e7ec}
    .admin-stat strong{display:block;font-size:24px;line-height:1}
    .admin-stat span{display:block;margin-top:6px;font-size:11px;color:#667085}
    .admin-row{background:#fff;color:#101828;border-radius:18px;padding:14px;margin-bottom:10px;border:1px solid #e4e7ec}
    .admin-meta{font-size:12px;color:#667085;line-height:1.5;margin-top:5px}
    .admin-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#98a2b3}
    .status-dot.good{background:#12b76a}.status-dot.warn{background:#f79009}.status-dot.bad{background:#f04438}
    .admin-logo{width:54px;height:54px;border-radius:12px;overflow:hidden;background:#eef2ff;display:grid;place-items:center;font-weight:900;color:#3730a3;flex:0 0 auto}
    .admin-logo img{width:100%;height:100%;object-fit:cover}


    .workflow-steps{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
    .workflow-step{font-size:10px;font-weight:800;padding:5px 7px;border-radius:999px;background:#f2f4f7;color:#667085;border:1px solid #e4e7ec}
    .workflow-step.done{background:#ecfdf3;color:#067647;border-color:#abefc6}
    .workflow-step.current{background:#fff4ed;color:#b93815;border-color:#ffd6ae}
    .shortlist-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;background:#eef4ff;color:#3538cd;border:1px solid #c7d7fe}


    .offer-box{border:1px solid #c7d7fe;background:#eef4ff;color:#3538cd;border-radius:14px;padding:12px;margin:12px 0}
    .offer-box.accepted{background:#ecfdf3;color:#067647;border-color:#abefc6}
    .offer-box.declined{background:#fef3f2;color:#b42318;border-color:#fecdca}
    .offer-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
    .offer-value{background:rgba(255,255,255,.62);border-radius:9px;padding:8px;font-size:12px}


    .final-state{border-radius:14px;padding:12px;margin:10px 0;font-size:12px;font-weight:700}
    .final-state.unsuccessful{background:#fef3f2;color:#b42318;border:1px solid #fecdca}
    .final-state.withdrawn{background:#f2f4f7;color:#475467;border:1px solid #e4e7ec}
    .final-state.hired{background:#ecfdf3;color:#067647;border:1px solid #abefc6}


    .notify-bell{position:relative;width:42px;height:42px;border-radius:9px;border:1px solid var(--line-dark);background:transparent;color:var(--paper);font-size:18px}
    .notify-count{position:absolute;right:-5px;top:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;border:2px solid var(--ink)}
    .notification-item{padding:12px 0;border-bottom:1px solid var(--line-light)}
    .notification-item:last-child{border-bottom:0}
    .notification-item.unread{font-weight:700}
    .notification-time{font-size:11px;color:var(--muted);margin-top:4px}
    .timeline{margin:12px 0;padding-left:8px}
    .timeline-item{position:relative;padding:0 0 14px 22px;border-left:2px solid #ddd6c4}
    .timeline-item:last-child{border-left-color:transparent;padding-bottom:0}
    .timeline-dot{position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--paper)}
    .timeline-title{font-size:12px;font-weight:900}
    .timeline-meta{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
    .job-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .job-status{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}
    .job-status.active{background:#ecfdf3;color:#067647}
    .job-status.paused{background:#fffaeb;color:#b54708}
    .job-status.closed{background:#f2f4f7;color:#475467}
    .applicant-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
    .pill.bad{background:var(--bad-tint);color:var(--bad)}

</style>
</head>
<body>
<div class="app">
  <header class="topbar hidden" id="topbar">
    <div class="row">
      <div>
        <div class="brand"><div class="logo">B</div><div>Buisder</div></div>
        <div class="subtle" id="modeLabel">Swipe-friendly jobs for young people</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="notify-bell" id="notifyBell" onclick="openNotifications()" aria-label="Notifications">
          🔔<span class="notify-count hidden" id="notifyCount">0</span>
        </button>
        <button class="btn btn-outline" onclick="doLogout()">Log out</button>
      </div>
    </div>
  </header>

  <main id="content"><div style="padding:60px 16px;text-align:center;color:var(--muted-on-dark)">Loading…</div></main>
  <nav class="bottomnav hidden" id="bottomnav"></nav>
</div>

<div id="modal" class="modal hidden" onclick="closeModal(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="handle"></div>
    <div id="modalContent"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
let state = {
  user:null,
  mode:null,
  tab:null,
  profile:{},
  jobs:[],
  applications:[],
  skipped:[],
  lastAction:null,
  postedJobs:[],
  applicants:[],
  notifications:[],
  applicantFilters:{jobId:"all", status:"all"},
  admin:{overview:{}, verifications:[], users:[], jobs:[], auditLog:[]},
  authMode:"login",
  authRole:"jobseeker",
  authError:"",
  feedFilters: (() => {
    try{
      return JSON.parse(localStorage.getItem("buisder_feed_filters")) || {
        category:"Any", maxDistance:25, minPay:"", employmentType:"Any",
        experience:"Any", availability:"Match profile"
      };
    }catch(e){
      return {category:"Any", maxDistance:25, minPay:"", employmentType:"Any", experience:"Any", availability:"Match profile"};
    }
  })()
};

let draftJobLat = null;
let draftJobLng = null;

function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }

function formatInterview(value){
  if(!value) return "";
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return value.replace("T"," ");
  return d.toLocaleString("en-IE", {
    weekday:"short", day:"numeric", month:"short", year:"numeric",
    hour:"2-digit", minute:"2-digit"
  });
}


function formatTimelineDate(value){
  if(!value) return "";
  const normalized = String(value).includes("T") ? String(value) : String(value).replace(" ","T") + "Z";
  const d = new Date(normalized);
  if(Number.isNaN(d.getTime())) return String(value);
  return d.toLocaleString("en-IE", {
    day:"numeric", month:"short", year:"numeric",
    hour:"2-digit", minute:"2-digit"
  });
}

function statusHistoryLabel(status){
  const map = {
    applied:"Applied",
    shortlisted:"Shortlisted",
    interview_invited:"Interview invited",
    interview_accepted:"Interview accepted",
    interview_declined:"Interview declined",
    interview_completed:"Interview completed",
    offer_made:"Offer made",
    offer_accepted:"Offer accepted",
    offer_declined:"Offer declined",
    hired:"Hired",
    unsuccessful:"Unsuccessful",
    withdrawn:"Withdrawn"
  };
  return map[status] || cap(String(status || "").replaceAll("_"," "));
}

function renderApplicationTimeline(a, viewer){
  const history = Array.isArray(a?.statusHistory) ? a.statusHistory : [];
  if(!history.length){
    return `<div class="notice">No timeline history is available for this application yet.</div>`;
  }

  return `
    <div class="timeline">
      ${history.map(h=>{
        let actor = "";
        if(h.actorUserId){
          if(viewer==="jobseeker"){
            actor = h.actorRole==="jobseeker" ? "You" : (h.actorRole==="employer" ? "Employer" : (h.actorName || "Buisder"));
          } else {
            actor = h.actorRole==="employer" ? "You / employer" : (h.actorRole==="jobseeker" ? (h.actorName || "Candidate") : (h.actorName || "Buisder"));
          }
        } else {
          actor = "Buisder";
        }
        return `
          <div class="timeline-item">
            <span class="timeline-dot"></span>
            <div class="timeline-title">${statusHistoryLabel(h.status)}</div>
            <div class="timeline-meta">${formatTimelineDate(h.createdAt)} · ${actor}</div>
            ${viewer==="employer" && h.note ? `<div class="timeline-meta">${h.note}</div>` : ""}
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function applicationStatusLabel(a){
  const status = a && a.status;
  if(status==="shortlisted") return "Shortlisted";
  if(status==="interview_invited" || status==="invited") return "Interview invited";
  if(status==="interview_accepted") return "Interview confirmed";
  if(status==="interview_declined") return "Interview declined";
  if(status==="interview_completed") return "Interview completed";
  if(status==="offer_made") return "Offer made";
  if(status==="offer_accepted") return "Offer accepted";
  if(status==="offer_declined") return "Offer declined";
  if(status==="hired") return "Hired";
  if(status==="unsuccessful") return "Unsuccessful";
  if(status==="withdrawn") return "Withdrawn";
  return "Applied";
}

function interviewStatusLabel(a){
  return applicationStatusLabel(a);
}

function applicationStatusClass(a){
  if(["shortlisted","interview_accepted","interview_completed","offer_accepted","hired"].includes(a.status)) return "good";
  if(["interview_declined","offer_declined","withdrawn"].includes(a.status)) return "soft";
  if(a.status==="unsuccessful") return "bad";
  return "soft";
}

function workflowStepClass(a, step){
  const order = {
    applied:0,
    shortlisted:1,
    interview_invited:2,
    invited:2,
    interview_accepted:3,
    interview_declined:3,
    interview_completed:4,
    offer_made:5,
    offer_accepted:6,
    offer_declined:6,
    hired:7
  };
  const here = order[a.status] ?? 0;
  const target = order[step];
  if(here > target) return "done";
  if(here === target) return "current";
  return "";
}

function renderWorkflowSteps(a){
  if(a.status==="unsuccessful"){
    return `<div class="final-state unsuccessful">Application closed · Unsuccessful</div>`;
  }
  if(a.status==="withdrawn"){
    return `<div class="final-state withdrawn">Application closed · Withdrawn</div>`;
  }

  const interviewOutcome = a.status==="interview_declined" ? "Interview declined" : "Interview accepted";
  const offerOutcome = a.status==="offer_declined" ? "Offer declined" : "Offer accepted";
  return `
    <div class="workflow-steps">
      <span class="workflow-step ${workflowStepClass(a,"applied")}">Applied</span>
      <span class="workflow-step ${workflowStepClass(a,"shortlisted")}">Shortlisted</span>
      <span class="workflow-step ${workflowStepClass(a,"interview_invited")}">Interview invited</span>
      <span class="workflow-step ${workflowStepClass(a,"interview_accepted")}">${interviewOutcome}</span>
      <span class="workflow-step ${workflowStepClass(a,"interview_completed")}">Interview complete</span>
      <span class="workflow-step ${workflowStepClass(a,"offer_made")}">Offer</span>
      <span class="workflow-step ${workflowStepClass(a,"offer_accepted")}">${offerOutcome}</span>
      <span class="workflow-step ${workflowStepClass(a,"hired")}">Hired</span>
    </div>
  `;
}

function unreadNotificationCount(){
  return (state.notifications || []).filter(n=>!n.readAt).length;
}

const shownBrowserNotificationIds = new Set();

async function enableBrowserNotifications(){
  if (!("Notification" in window)) {
    toast("Browser notifications are not supported on this device");
    return;
  }
  const permission = await Notification.requestPermission();
  if(permission === "granted"){
    toast("Browser notifications enabled");
    notifyUnreadNotifications();
  } else {
    toast("Notifications were not enabled");
  }
}

function notifyUnreadNotifications(){
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  for(const n of (state.notifications || [])){
    if(!n.readAt && !shownBrowserNotificationIds.has(n.id)){
      shownBrowserNotificationIds.add(n.id);
      new Notification(n.title || "Buisder update", {body:n.body || ""});
    }
  }
}

function renderNotificationBell(){
  const badge = document.getElementById("notifyCount");
  if(!badge) return;
  const count = unreadNotificationCount();
  badge.textContent = count > 99 ? "99+" : String(count);
  badge.classList.toggle("hidden", count === 0);
}

async function openNotification(id){
  const n = (state.notifications || []).find(x=>String(x.id)===String(id));
  if(!n) return;
  try{
    if(!n.readAt) await api(`/api/notifications/${id}`, {method:"POST"});
  }catch(e){}
  closeModal();
  await loadBootstrap();
  if(n.applicationId){
    state.tab = state.mode==="jobseeker" ? "applications" : state.mode==="employer" ? "applicants" : state.tab;
  }
  render();
}

async function markAllNotificationsRead(){
  try{
    await api("/api/notifications/read-all", {method:"POST"});
    await loadBootstrap();
    render();
    openNotifications();
  }catch(e){ toast(e.message); }
}

async function api(path, opts = {}){
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: opts.body ? { "Content-Type":"application/json" } : undefined,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    credentials:"include"
  });
  let data = null;
  try{ data = await res.json(); } catch(e){}
  if(!res.ok){ throw new Error((data && data.error) || "Something went wrong"); }
  return data;
}

async function loadBootstrap(){
  const data = await api("/api/bootstrap");
  state.user = data.user;
  if(!data.user) return;

  state.mode = data.user.isAdmin ? "admin" : data.user.role;

  const validTab = state.mode==="jobseeker"
    ? ["feed","applications","profile"].includes(state.tab)
    : state.mode==="employer"
      ? ["home","post","applicants","profile"].includes(state.tab)
      : ["admin-home","verifications","admin-users","admin-jobs"].includes(state.tab);

  if(!validTab){
    state.tab = state.mode==="jobseeker" ? "feed" : (state.mode==="employer" ? "home" : "admin-home");
  }

  if(state.mode==="admin"){
    state.admin = data.admin || {overview:{}, verifications:[], users:[], jobs:[], auditLog:[]};
    state.notifications = data.notifications || [];
    state.profile = {};
    state.jobs = [];
    state.applications = [];
    state.skipped = [];
    state.postedJobs = [];
    state.applicants = [];
    return;
  }

  state.profile = data.profile || {};
  state.notifications = data.notifications || [];
  if(state.mode==="jobseeker"){
    state.jobs = data.jobs || [];
    state.applications = data.applications || [];
    state.skipped = data.skipped || [];
    setTimeout(notifyUnreadNotifications, 50);
  } else {
    state.postedJobs = data.postedJobs || [];
    state.applicants = data.applicants || [];
  }
}

async function boot(){
  try{ await loadBootstrap(); } catch(e){ state.user = null; }
  render();
  setInterval(async ()=>{
    if(!state.user) return;
    try{
      const before = unreadNotificationCount();
      await loadBootstrap();
      const after = unreadNotificationCount();
      if(after !== before) render();
      notifyUnreadNotifications();
    }catch(e){}
  }, 20000);
}

async function setTab(tab){
  state.tab = tab;
  render();
  if(tab==="applications" && state.mode==="jobseeker"){
    const unseen = state.applications.filter(a => a.interviewAt && !a.inviteSeenAt);
    for(const a of unseen){
      try{
        await api(`/api/applications/${a.id}/seen`, {method:"POST"});
        a.inviteSeenAt = new Date().toISOString();
      } catch(e){}
    }
    render();
  }
}

function normalizeList(value){
  if(Array.isArray(value)) return value.map(v=>String(v).trim().toLowerCase()).filter(Boolean);
  return String(value || "").split(",").map(v=>v.trim().toLowerCase()).filter(Boolean);
}

function parsePay(job){
  if(job.pay_min !== null && job.pay_min !== undefined && job.pay_min !== "") return Number(job.pay_min) || 0;
  const match = String(job.pay || "").replace(",", ".").match(/(\d+(?:\.\d+)?)/);
  return match ? Number(match[1]) : 0;
}

function ageBandMinimum(ageBand){
  const match = String(ageBand || "").match(/(\d+)/);
  return match ? Number(match[1]) : 0;
}

function haversineKm(lat1, lon1, lat2, lon2){
  const vals = [lat1,lon1,lat2,lon2].map(Number);
  if(vals.some(v=>!Number.isFinite(v))) return null;
  const [a,b,c,d] = vals;
  const R = 6371;
  const toRad = x => x * Math.PI / 180;
  const dLat = toRad(c-a), dLon = toRad(d-b);
  const q = Math.sin(dLat/2)**2 + Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(q));
}

function scheduleOverlap(job){
  const wanted = normalizeList(state.profile.availability);
  const offered = normalizeList(job.schedule_tags);
  if(!wanted.length || !offered.length) return null;
  const synonyms = {
    "sat":"saturday","sun":"sunday","weekend":"saturday","weekends":"saturday",
    "evening":"evenings","holiday":"holidays","school/college holidays":"holidays"
  };
  const normal = x => synonyms[x] || x;
  const w = wanted.map(normal);
  const o = offered.map(normal);
  return w.some(x => o.some(y => x.includes(y) || y.includes(x)));
}

function categoryFor(job){
  return (job.tags && job.tags[0]) || "General";
}

function jobDistance(job){
  return haversineKm(
    state.profile.latitude, state.profile.longitude,
    job.latitude, job.longitude
  );
}

function ageEligible(job){
  const candidateMin = ageBandMinimum(state.profile.age_band);
  const required = Number(job.min_age || 16);
  if(!candidateMin) return true;
  return candidateMin >= required;
}

function scoreJob(job){
  let score = 0;
  let weight = 0;

  // Category / interests: 25
  const interests = normalizeList(state.profile.interests);
  const category = categoryFor(job).toLowerCase();
  weight += 25;
  if(!interests.length) score += 12;
  else if(interests.some(x => category.includes(x) || x.includes(category))) score += 25;

  // Availability: 20
  weight += 20;
  const overlap = scheduleOverlap(job);
  if(overlap === true) score += 20;
  else if(overlap === null) score += 10;

  // Distance / location: 20
  weight += 20;
  const distance = jobDistance(job);
  const maxDistance = Number(state.feedFilters.maxDistance || state.profile.max_distance_km || 25);
  if(distance !== null){
    if(distance <= Math.max(5,maxDistance*.25)) score += 20;
    else if(distance <= Math.max(10,maxDistance*.6)) score += 16;
    else if(distance <= maxDistance) score += 10;
  } else {
    const pl = String(state.profile.location || "").toLowerCase();
    const jl = String(job.location || "").toLowerCase();
    if(pl && jl && (pl.includes(jl) || jl.includes(pl))) score += 16;
    else score += 8;
  }

  // Pay: 15
  weight += 15;
  const pay = parsePay(job);
  const minPay = Number(state.feedFilters.minPay || state.profile.min_pay || 0);
  if(!minPay) score += pay ? 12 : 8;
  else if(pay >= minPay) score += 15;

  // Employment type: 10
  weight += 10;
  const preferredType = state.profile.preferred_employment_type || "Any";
  if(preferredType === "Any") score += 7;
  else if(job.employment_type === preferredType) score += 10;

  // Experience: 10
  weight += 10;
  const exp = String(job.experience || "None");
  if(exp === "None") score += 10;
  else if(exp === "Helpful") score += 7;
  else score += 3;

  return Math.max(0, Math.min(100, Math.round(score / weight * 100)));
}

function currentFeedJobs(){
  const f = state.feedFilters || {};
  const minPay = Number(f.minPay || 0);
  const maxDistance = Number(f.maxDistance || 0);

  return state.jobs
    .filter(j => !state.applications.some(a=>a.jobId===j.id) && !state.skipped.includes(j.id))
    .filter(ageEligible)
    .filter(j => f.category==="Any" || categoryFor(j)===f.category)
    .filter(j => f.employmentType==="Any" || (j.employment_type || "Part-time")===f.employmentType)
    .filter(j => f.experience==="Any" || (f.experience==="None required" ? (j.experience || "None")==="None" : (j.experience || "None")!== "Required"))
    .filter(j => !minPay || !parsePay(j) || parsePay(j) >= minPay)
    .filter(j => {
      if(f.availability!=="Match profile") return true;
      const overlap = scheduleOverlap(j);
      return overlap !== false;
    })
    .filter(j => {
      if(!maxDistance) return true;
      const distance = jobDistance(j);
      return distance === null || distance <= maxDistance;
    })
    .map(j => ({...j, _matchScore:scoreJob(j), _distance:jobDistance(j)}))
    .sort((a,b) => b._matchScore - a._matchScore);
}

async function prepareProfilePhotoFile(file){
  if(!file) return null;
  if(!file.type || !file.type.startsWith("image/")) throw new Error("Please choose an image file");
  if(file.size > 5 * 1024 * 1024) throw new Error("Image must be under 5 MB");

  const dataUrl = await new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(new Error("Could not read image"));
    reader.readAsDataURL(file);
  });

  const img = await new Promise((resolve, reject)=>{
    const i = new Image();
    i.onload = ()=>resolve(i);
    i.onerror = ()=>reject(new Error("Could not load image"));
    i.src = dataUrl;
  });

  const size = 480;
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  const side = Math.min(img.width, img.height);
  const sx = (img.width - side) / 2;
  const sy = (img.height - side) / 2;
  ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);

  const canvasBlob = quality => new Promise((resolve, reject)=>{
    canvas.toBlob(
      blob => blob ? resolve(blob) : reject(new Error("Could not prepare image")),
      "image/jpeg",
      quality
    );
  });

  let quality = .82;
  let blob = await canvasBlob(quality);
  while(blob.size > 600 * 1024 && quality > .45){
    quality -= .08;
    blob = await canvasBlob(quality);
  }
  return blob;
}

async function uploadR2File(kind, file, filename){
  if(!file) return null;
  const form = new FormData();
  form.append("kind", kind);
  form.append("file", file, filename || file.name || "file");

  const res = await fetch("/api/files/upload", {
    method:"POST",
    body:form,
    credentials:"include"
  });

  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw new Error((data && data.error) || "File upload failed");
  return data;
}

function captureProfileLocation(){
  if(!navigator.geolocation){ toast("Location is not supported on this device"); return; }
  const el = document.getElementById("profileGeoStatus");
  if(el) el.textContent = "Getting location…";
  navigator.geolocation.getCurrentPosition(
    pos => {
      state.profile.latitude = pos.coords.latitude;
      state.profile.longitude = pos.coords.longitude;
      if(el) el.textContent = "Location saved for distance matching. It will be stored when you save your profile.";
      toast("Location captured");
    },
    () => {
      if(el) el.textContent = "Could not access location. You can continue without it.";
      toast("Location permission was not granted");
    },
    {enableHighAccuracy:false, timeout:10000, maximumAge:300000}
  );
}

      ageBand: document.getElementById("page").value,

async function completeOnboarding(){
  try{
    const f = document.getElementById("onboardPhoto");
    if(f && f.files && f.files[0]){
      toast("Uploading profile photo…");
      const blob = await prepareProfilePhotoFile(f.files[0]);
      await uploadR2File("profile-photo", blob, "profile.jpg");
    }

    const body = {
      name: document.getElementById("onboardName").value || "",
      ageBand: document.getElementById("onboardAge").value,
      phone: state.profile.phone || "",
      location: document.getElementById("onboardLocation").value || "",
      about: document.getElementById("onboardAbout").value || "",
      skills: document.getElementById("onboardSkills").value || "",
      education: state.profile.education || "",
      experience: state.profile.experience || "",
      availability: document.getElementById("onboardAvailability").value || "",
      interests: document.getElementById("onboardInterests").value || "",
      transport: state.profile.transport || "Public transport",
      onboardingComplete: true,
      maxDistanceKm: state.profile.max_distance_km || 25,
      minPay: state.profile.min_pay ?? "",
      preferredEmploymentType: state.profile.preferred_employment_type || "Any",
      latitude: state.profile.latitude ?? null,
      longitude: state.profile.longitude ?? null
    };

    await api("/api/profile", {method:"PUT", body});
    await loadBootstrap();
    state.tab = "feed";
    render();
    toast("Profile completed");
  }catch(e){ toast(e.message); }
}

  if(status==="rejected") return `<span class="pill" style="background:#fef3f2;color:#b42318">Rejected</span>`;
  return `<span class="pill soft">Unverified</span>`;
}

function openAdminVerificationDecision(userId, action){
  const v = (state.admin.verifications || []).find(x=>String(x.userId)===String(userId));
  if(!v) return;
  const approving = action==="approve";
  openModal(`
    <h3>${approving ? "Approve business" : "Reject / revoke verification"}</h3>
    <p><strong>${v.companyName || v.legalName || v.email}</strong></p>
    <label>Admin note</label>
    <textarea id="adminVerificationNote" placeholder="${approving ? "Optional approval note" : "Reason for rejection or revocation"}">${approving ? "Manually verified by Buisder admin" : ""}</textarea>
    <div class="notice">
      ${approving
        ? "The business will immediately display a Verified business badge to job seekers."
        : "The verified badge will be removed and the employer will see that verification needs attention."}
    </div>
    <button class="btn ${approving ? "btn-good" : "btn-bad"} btn-block" onclick="adminVerificationAction('${userId}','${action}')">
      ${approving ? "Approve verification" : "Reject verification"}
    </button>
  `);
}

    render();

    render();
    toast(`Job ${action==="reopen" ? "reopened" : action==="pause" ? "paused" : "closed"}`);

function captureJobLocation(){
  if(!navigator.geolocation){ toast("Location is not supported on this device"); return; }
  const el = document.getElementById("jobGeoStatus");
  if(el) el.textContent = "Getting workplace location…";
  navigator.geolocation.getCurrentPosition(
    pos => {
      draftJobLat = pos.coords.latitude;
      draftJobLng = pos.coords.longitude;
      if(el) el.textContent = "Workplace location captured for distance matching.";
      toast("Workplace location captured");
    },
    () => {
      if(el) el.textContent = "Could not access location. You can still post the job.";
      toast("Location permission was not granted");
    },
    {enableHighAccuracy:false, timeout:10000, maximumAge:300000}
  );
}

async function postJob(){
  const title = document.getElementById("jtitle").value.trim();
  if(!title){ toast("Add a job title"); return; }
  const scheduleTags = document.getElementById("jschedule").value
    .split(",").map(x=>x.trim()).filter(Boolean);

  const body = {
    title,
    location: document.getElementById("jlocation").value || "Cork",
    pay: document.getElementById("jpay").value || "Pay shown on request",
    payMin: document.getElementById("jpaymin").value,
    hours: document.getElementById("jhours").value || "Flexible",
    experience: document.getElementById("jexp").value,
    employmentType: document.getElementById("jemployment").value,
    minAge: Number(document.getElementById("jminage").value),
    scheduleTags,
    latitude: draftJobLat,
    longitude: draftJobLng,
    startDate: document.getElementById("jstart").value || "To be agreed",
    description: document.getElementById("jdescription").value || "",
    tags: [document.getElementById("jindustry").value]
  };
  try{
    await api("/api/jobs", {method:"POST", body});
    draftJobLat = null;
    draftJobLng = null;
    await loadBootstrap();
    state.tab = "home";
    render();
    toast("Job published");
  } catch(e){ toast(e.message); }
}

function applicantMatchesStatus(a, filter){
  if(filter==="all") return true;
  if(filter==="active") return !["hired","unsuccessful","withdrawn"].includes(a.status);
  if(filter==="interviews") return ["interview_invited","interview_accepted","interview_declined","interview_completed"].includes(a.status);
  if(filter==="offers") return ["offer_made","offer_accepted","offer_declined"].includes(a.status);
  if(filter==="closed") return ["hired","unsuccessful","withdrawn"].includes(a.status);
  return a.status===filter;
}

function openMarkUnsuccessful(id){

  if(!a) return;

  openModal(`
    <h3>Mark candidate unsuccessful</h3>
    <p><strong>${a.applicantName || a.applicantEmail}</strong> · ${a.jobTitle}</p>
    <div class="notice">
      This will close the application and remove any outstanding interview invitation or pending offer.
    </div>
    <label>Internal note / reason (optional)</label>
    <textarea id="unsuccessfulNote" placeholder="Optional note for the Buisder application history"></textarea>
    <button class="btn btn-bad btn-block" style="margin-top:12px" onclick="markUnsuccessful('${a.id}')">Confirm unsuccessful</button>
  `);
}

async function markUnsuccessful(id){

    await api(`/api/applications/${id}/status`, {

function openOffer(id){
  const a = state.applicants.find(x=>String(x.id)===String(id));

  openModal(`
    <h3>${a.offerStatus ? "Update job offer" : "Make job offer"}</h3>
    <p>${a.applicantName || a.applicantEmail} · ${a.jobTitle}</p>

    <label>Role / position</label>

    <button class="btn btn-good btn-block" style="margin-top:12px" onclick="sendOffer('${a.id}')">

async function sendOffer(id){
  const roleTitle = document.getElementById("offerRoleTitle").value.trim();
  const pay = document.getElementById("offerPay").value.trim();
  const startDate = document.getElementById("offerStartDate").value;
  const message = document.getElementById("offerMessage").value.trim();

  if(!roleTitle){ toast("Add the role title"); return; }
  if(!pay){ toast("Add the pay"); return; }
  if(!startDate){ toast("Choose a start date"); return; }

  try{
    await api(`/api/applications/${id}/offer`, {
      method:"POST",
      body:{roleTitle, pay, startDate, message}
    });
    closeModal();
    await loadBootstrap();
    render();
    toast("Job offer sent");
  }catch(e){ toast(e.message); }
}

        <input id="bcompany" value="${p.company_name || ""}" placeholder="e.g. Harbour Sports">

        <label>Legal business name</label>
        <input id="blegalname" value="${p.legal_name || ""}" placeholder="e.g. Harbour Sports Limited">

        <label>Company / registration number</label>
        <input id="breg" value="${p.registration_number || ""}" placeholder="e.g. CRO number">

        <label>Email</label>
        <input value="${state.user.email || ""}" disabled style="opacity:.6">

        <label>Business phone</label>
        <input id="bphone" type="tel" value="${p.phone || ""}" placeholder="Business contact number">

        <label>Website</label>
        <input id="bwebsite" type="url" value="${p.website || ""}" placeholder="https://...">

        <label>Location</label>
        <input id="blocation" value="${p.location || ""}" placeholder="e.g. Cork">

        <label>About the business</label>
        <textarea id="bdescription" placeholder="A short intro candidates will see">${p.description || ""}</textarea>

        <div class="verification-card ${businessVerificationClass(status)}">
          <strong>${businessVerificationLabel(status)}</strong>
          <div style="margin-top:5px;font-size:12px;line-height:1.4">
            ${status==="verified"
              ? "Your account has been manually verified. Candidates will see a verified badge."
              : status==="pending"
                ? "Your details are waiting for manual review. You can still update your profile."
                : status==="rejected"
                  ? `The verification request needs attention.${p.verification_note ? " " + p.verification_note : ""}`
                  : "Complete the required business details, save them, then submit for verification."}
          </div>
        </div>

        <button class="btn btn-dark btn-block" onclick="saveBusinessProfile()">Save business profile</button>
        ${status!=="verified" && status!=="pending"
          ? `<button class="btn btn-good btn-block" style="margin-top:10px" onclick="submitBusinessVerification()">Submit for verification</button>`
          : ""}
      </div>
    </div>
  `;
}

async function saveBusinessProfile(){
  try{
    const logoInput = document.getElementById("blogo");
    if(logoInput && logoInput.files && logoInput.files[0]){
      toast("Uploading business image…");
      const blob = await prepareProfilePhotoFile(logoInput.files[0]);
      await uploadR2File("business-logo", blob, "business-logo.jpg");
    }

    const body = {
      name: document.getElementById("bname").value || "",
      companyName: document.getElementById("bcompany").value || "",
      legalName: document.getElementById("blegalname").value || "",
      registrationNumber: document.getElementById("breg").value || "",
      phone: document.getElementById("bphone").value || "",
      website: document.getElementById("bwebsite").value || "",
      location: document.getElementById("blocation").value || "",
      description: document.getElementById("bdescription").value || ""
    };

    await api("/api/profile", {method:"PUT", body});
    await loadBootstrap();
    toast("Business profile saved");
    render();
  } catch(e){ toast(e.message); }
}

function openModal(html){
  document.getElementById("modalContent").innerHTML = html;
  document.getElementById("modal").classList.remove("hidden");
}
function closeModal(e){
  if(!e || e.target.id==="modal"){ document.getElementById("modal").classList.add("hidden"); }
}

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  setTimeout(()=>t.classList.add("hidden"), 1800);
}

function setupSwipe(){
  const card = document.getElementById("swipeCard");
  if(!card) return;
  const like = document.getElementById("likeBadge");
  const nope = document.getElementById("nopeBadge");
  let startX = 0, currentX = 0, dragging = false;

  const pointerDown = (clientX) => {
    dragging = true;
    startX = clientX;
    currentX = 0;
    card.style.transition = "none";
  };

  const pointerMove = (clientX) => {
    if(!dragging) return;
    currentX = clientX - startX;
    const rotate = currentX * 0.06;
    card.style.transform = `translateX(${currentX}px) rotate(${rotate}deg)`;
    if(currentX > 0){
      like.style.opacity = Math.min(currentX/80, 1);
      nope.style.opacity = 0;
    } else {
      nope.style.opacity = Math.min(Math.abs(currentX)/80, 1);
      like.style.opacity = 0;
    }
  };

  const pointerUp = () => {
    if(!dragging) return;
    dragging = false;
    card.style.transition = "transform .25s ease, opacity .25s ease";
    if(currentX > 120){
      card.style.transform = "translateX(120%) rotate(18deg)";
      like.style.opacity = 1;
      setTimeout(()=>acceptCurrent(), 180);
      return;
    }
    if(currentX < -120){
      card.style.transform = "translateX(-120%) rotate(-18deg)";
      nope.style.opacity = 1;
      setTimeout(()=>skipCurrent(), 180);
      return;
    }
    card.style.transform = "";
    like.style.opacity = 0;
    nope.style.opacity = 0;
  };

  card.addEventListener("mousedown", e => pointerDown(e.clientX));
  window.addEventListener("mousemove", e => pointerMove(e.clientX));
  window.addEventListener("mouseup", pointerUp);

  card.addEventListener("touchstart", e => pointerDown(e.touches[0].clientX), {passive:true});
  card.addEventListener("touchmove", e => pointerMove(e.touches[0].clientX), {passive:true});
  card.addEventListener("touchend", pointerUp);
}

boot();
</script>
</body>
</html>
