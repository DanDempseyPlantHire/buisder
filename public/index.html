<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="Buisder - swipe-friendly job matching for young people. Apply to local jobs in seconds." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2210%22 fill=%22%237c3aed%22/><text x=%2250%25%22 y=%2262%25%22 font-size=%2258%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22900%22 text-anchor=%22middle%22>B</text></svg>" />
  <title>Buisder - Swipe Prototype</title>
  <style>
    :root{
      --ink:#181814;
      --panel:#211f19;
      --paper:#f5f2ea;
      --paper-dim:#eae5d8;
      --text:#181814;
      --muted:#8a8477;
      --muted-on-dark:#a39c8c;
      --line-dark:rgba(245,242,234,.14);
      --line-light:#ddd6c4;
      --accent:#c1531f;
      --accent-ink:#7a3512;
      --accent-tint:#f4e2d4;
      --good:#3d6b46;
      --good-tint:#e4ede2;
      --bad:#a63a2c;
      --bad-tint:#f4e2dd;
      --radius:10px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--paper)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{
      width:min(100%,430px);
      min-height:100vh;
      margin:0 auto;
      position:relative;
      background:var(--ink);
      overflow:hidden;
    }
    .topbar{
      position:sticky;top:0;z-index:30;
      padding:14px 16px 10px;
      background:var(--ink);
      border-bottom:1px solid var(--line-dark);
    }
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
    .logo{
      width:36px;height:36px;border-radius:8px;background:var(--accent);
      display:grid;place-items:center;font-weight:700;color:var(--paper)
    }
    .subtle{font-size:12px;color:var(--muted-on-dark)}
    .modepill{
      display:flex;background:transparent;padding:3px;border-radius:10px;border:1px solid var(--line-dark)
    }
    .modepill button{
      border:0;background:transparent;color:var(--muted-on-dark);padding:8px 10px;border-radius:7px;font-size:12px;font-weight:600
    }
    .modepill button.active{background:var(--paper);color:var(--ink)}
    main{padding-bottom:92px}
    .hidden{display:none!important}
    .hero{
      margin:16px;background:var(--accent);
      border-radius:12px;padding:20px
    }
    .hero h1{margin:0 0 10px;font-size:26px;line-height:1.1;letter-spacing:-.02em;font-weight:700}
    .hero p{margin:0;color:var(--accent-tint);font-size:14px;line-height:1.5}
    .cta-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
    .btn{
      border:0;border-radius:8px;padding:12px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px
    }
    .btn-dark{background:var(--panel);color:var(--paper);border:1px solid var(--line-dark)}
    .btn-light{background:var(--paper);color:var(--ink)}
    .btn-soft{background:rgba(245,242,234,.14);color:var(--paper)}
    .btn-good{background:var(--good-tint);color:var(--good)}
    .btn-bad{background:var(--bad-tint);color:var(--bad)}
    .btn-outline{background:transparent;border:1px solid var(--line-dark);color:var(--paper)}
    .btn-block{width:100%}
    .section-pad{padding:0 16px}
    .title-row{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:18px 0 10px}
    .title-row h2{margin:0;font-size:17px;letter-spacing:-.01em;font-weight:700}
    .title-row span{font-size:12px;color:var(--muted-on-dark)}
    .card{
      background:var(--paper);color:var(--text);border-radius:var(--radius);padding:16px;border:1px solid var(--line-light)
    }
    .card.dark{
      background:var(--panel);color:var(--paper);border:1px solid var(--line-dark)
    }
    .small{font-size:12px;color:var(--muted)}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
    .chip{
      padding:7px 10px;border-radius:8px;background:var(--paper-dim);font-size:12px;font-weight:600;color:#4b4638
    }
    .chip.dark{background:rgba(245,242,234,.1);color:var(--paper);border:1px solid var(--line-dark)}
    .chip.good{background:var(--good-tint);color:var(--good)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .stat{
      background:var(--panel);border:1px solid var(--line-dark);border-radius:10px;padding:14px;text-align:center
    }
    .stat strong{display:block;font-size:19px;font-weight:700}
    .stat span{font-size:11px;color:var(--muted-on-dark)}
    .feed-wrap{padding:10px 16px 110px}
    .feed-intro{
      display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px
    }
    .feed-intro h2{margin:0;font-size:17px;font-weight:700}
    .feed-intro .hint{font-size:12px;color:var(--muted-on-dark)}
    .feed{
      position:relative;
      min-height:72vh;
    }
    .job-card{
      position:relative;
      width:100%;
      min-height:72vh;
      border-radius:12px;
      overflow:hidden;
      border:1px solid var(--line-light);
      background:var(--paper);
      color:var(--ink);
      touch-action:pan-y;
      user-select:none;
      transition:transform .25s ease, opacity .25s ease;
    }
    .job-image{
      min-height:30vh;
      padding:18px;
      color:var(--paper);
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      background:var(--ink);
      border-bottom:1px solid var(--line-dark);
    }
    .job-badge{
      display:inline-flex;align-self:flex-start;
      background:transparent;
      border:1px solid var(--line-dark);
      color:var(--paper);padding:6px 10px;border-radius:7px;font-size:11px;font-weight:600;
    }
    .job-image h3{margin:10px 0 4px;font-size:26px;line-height:1.1;letter-spacing:-.01em;font-weight:700}
    .job-image p{margin:0;color:var(--muted-on-dark)}
    .job-body{padding:18px}
    .grid{
      display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0
    }
    .metric{
      border:1px solid var(--line-light);
      border-radius:8px;
      padding:12px;
      background:var(--paper-dim)
    }
    .metric small{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
    .metric strong{font-size:14px}
    .why{
      background:var(--accent-tint);border-radius:10px;padding:13px;font-size:13px;line-height:1.5;color:var(--accent-ink)
    }
    .swipe-overlay{
      position:absolute;top:18px;z-index:2;padding:9px 14px;border-radius:7px;font-size:14px;
      font-weight:700;letter-spacing:.03em;opacity:0;transition:opacity .12s ease;
      border:2px solid transparent
    }
    .swipe-like{right:18px;background:var(--good-tint);color:var(--good);border-color:var(--good)}
    .swipe-nope{left:18px;background:var(--bad-tint);color:var(--bad);border-color:var(--bad)}
    .swipe-actions{
      display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px
    }
    .big-action{padding:14px 12px;border-radius:8px;border:0;font-weight:600}
    .skip{background:var(--bad-tint);color:var(--bad)}
    .details{background:var(--ink);color:var(--paper)}
    .accept{background:var(--good-tint);color:var(--good)}
    .feed-progress{
      display:flex;gap:6px;margin:12px 0 4px
    }
    .feed-progress span{
      flex:1;height:3px;border-radius:3px;background:var(--line-dark)
    }
    .feed-progress span.active{background:var(--accent)}
    .info-note{
      margin-top:12px;font-size:12px;color:var(--muted-on-dark);line-height:1.4
    }
    .list-card{margin-bottom:12px}
    .app-item{
      display:flex;align-items:center;justify-content:space-between;gap:12px
    }
    .pill{
      padding:6px 10px;border-radius:7px;font-size:11px;font-weight:600
    }
    .pill.good{background:var(--good-tint);color:var(--good)}
    .pill.soft{background:var(--accent-tint);color:var(--accent-ink)}
    .bottomnav{
      position:fixed;bottom:0;left:50%;transform:translateX(-50%);
      width:min(100%,430px);
      background:var(--ink);
      border-top:1px solid var(--line-dark);
      padding:8px 8px calc(8px + env(safe-area-inset-bottom));
      display:grid;grid-template-columns:repeat(4,1fr);z-index:40
    }
    .bottomnav button{
      border:0;border-top:2px solid transparent;background:transparent;color:var(--muted-on-dark);padding:10px 4px 6px;font-size:12px;font-weight:600
    }
    .bottomnav button.active{color:var(--paper);border-top-color:var(--accent)}
    .modal{
      position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:70
    }
    .sheet{
      width:min(100%,430px);background:var(--paper);color:var(--ink);border-radius:14px 14px 0 0;padding:20px;max-height:84vh;overflow:auto;border-top:1px solid var(--line-light)
    }
    .handle{width:40px;height:4px;border-radius:3px;background:var(--line-light);margin:0 auto 16px}
    .sheet h3{margin:0 0 8px;font-size:22px;letter-spacing:-.01em;font-weight:700}
    .sheet p{color:#565244;line-height:1.5}
    .toast{
      position:fixed;left:50%;transform:translateX(-50%);bottom:98px;background:var(--ink);color:var(--paper);
      border-radius:8px;padding:11px 15px;font-size:12px;font-weight:600;border:1px solid var(--line-dark);z-index:90
    }
    .empty{
      padding:30px 18px;text-align:center
    }
    .form-card{
      background:var(--paper);color:var(--ink);border-radius:10px;padding:16px;border:1px solid var(--line-light)
    }
    label{display:block;font-size:12px;font-weight:600;margin:12px 0 6px;color:#4b4638}
    input,select,textarea{
      width:100%;border:1px solid var(--line-light);border-radius:8px;padding:12px;background:#fff;color:var(--ink);outline:none
    }
    input:focus,select:focus,textarea:focus{border-color:var(--accent)}
    .notice{
      background:var(--paper-dim);border-radius:8px;padding:12px;font-size:12px;line-height:1.5;color:#565244;margin-top:12px
    }
    .interview-alert{
      background:var(--accent-tint);color:var(--accent-ink);border:1px solid #d7b19b;
      border-radius:10px;padding:14px;margin-bottom:12px
    }
    .interview-alert strong{display:block;margin-bottom:4px}
    .notify-btn{margin-top:10px;background:#fff;color:#111827;border:0;border-radius:12px;padding:10px 12px;font-weight:900}
    .interview-box{
      background:var(--good-tint);color:#294d30;border:1px solid #b8ccb9;
      border-radius:10px;padding:13px;margin:12px 0
    }
    .interview-box.pending{background:var(--accent-tint);color:var(--accent-ink);border-color:#d7b19b}
    .interview-box.declined{background:var(--bad-tint);color:var(--bad);border-color:#d9aaa1}
    .new-dot{
      display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;
      border-radius:9px;background:var(--accent);color:var(--paper);font-size:10px;margin-left:4px;padding:0 5px
    }
    @media (min-width:700px){
      body{padding:24px 0}
      .app{border-radius:14px;border:1px solid var(--line-dark);min-height:calc(100vh - 48px)}
      .bottomnav{bottom:24px;border-radius:0 0 14px 14px}
    }
  
    .profile-avatar{
      width:88px;height:88px;border-radius:50%;overflow:hidden;
      background:#eef2ff;color:#3730a3;display:grid;place-items:center;
      font-size:30px;font-weight:900;border:3px solid #fff;
      box-shadow:0 8px 24px rgba(17,24,39,.12);margin:0 auto 12px;
    }
    .profile-avatar img{width:100%;height:100%;object-fit:cover}
    .onboarding-banner{
      background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;
      border-radius:16px;padding:12px;margin:12px 0;font-size:13px;line-height:1.45
    }
    

    .jobseeker-photo{width:96px;height:96px;border-radius:50%;overflow:hidden;background:#eef2ff;color:#3730a3;display:grid;place-items:center;font-size:32px;font-weight:900;border:3px solid #fff;box-shadow:0 8px 24px rgba(17,24,39,.12);margin:0 auto 10px}
    .jobseeker-photo img{width:100%;height:100%;object-fit:cover}
    .photo-help{text-align:center;color:#667085;font-size:12px;margin:0 0 12px}
    .applicant-photo{width:50px;height:50px;border-radius:50%;overflow:hidden;background:#eef2ff;color:#3730a3;display:grid;place-items:center;font-weight:900;flex:0 0 auto}
    .applicant-photo img{width:100%;height:100%;object-fit:cover}


    .filter-bar{background:var(--panel);border:1px solid var(--line-dark);border-radius:10px;padding:10px 12px;margin-bottom:12px}
    .filter-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .filter-summary{font-size:12px;color:var(--muted-on-dark);line-height:1.35}
    .filter-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .filter-chip{font-size:11px;padding:5px 7px;border-radius:7px;background:rgba(245,242,234,.1);border:1px solid var(--line-dark);color:var(--paper)}
    .match-score{font-size:12px;font-weight:700;color:var(--good);background:var(--good-tint);padding:6px 8px;border-radius:7px}
    .geo-status{font-size:12px;color:var(--muted);margin-top:6px}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}


    .business-logo{
      width:84px;height:84px;border-radius:18px;overflow:hidden;
      background:#eef2ff;color:#3730a3;display:grid;place-items:center;
      font-size:28px;font-weight:900;border:1px solid var(--line);
      margin:0 auto 12px;
    }
    .business-logo img{width:100%;height:100%;object-fit:cover}
    .verification-card{
      border-radius:14px;padding:13px;margin:12px 0;
      border:1px solid var(--line);background:#f8fafc;color:#344054;
    }
    .verification-card.verified{background:#ecfdf3;color:#067647;border-color:#abefc6}
    .verification-card.pending{background:#fffaeb;color:#b54708;border-color:#fedf89}
    .verification-card.rejected{background:#fef3f2;color:#b42318;border-color:#fecdca}
    .verified-badge{
      display:inline-flex;align-items:center;gap:5px;
      border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;
      background:#ecfdf3;color:#067647;border:1px solid #abefc6;
    }
    .unverified-badge{
      display:inline-flex;align-items:center;gap:5px;
      border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;
      background:#f2f4f7;color:#667085;border:1px solid #e4e7ec;
    }


    .admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
    .admin-stat{background:#fff;color:#101828;border-radius:18px;padding:15px;border:1px solid #e4e7ec}
    .admin-stat strong{display:block;font-size:24px;line-height:1}
    .admin-stat span{display:block;margin-top:6px;font-size:11px;color:#667085}
    .admin-row{background:#fff;color:#101828;border-radius:18px;padding:14px;margin-bottom:10px;border:1px solid #e4e7ec}
    .admin-meta{font-size:12px;color:#667085;line-height:1.5;margin-top:5px}
    .admin-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#98a2b3}
    .status-dot.good{background:#12b76a}.status-dot.warn{background:#f79009}.status-dot.bad{background:#f04438}
    .admin-logo{width:54px;height:54px;border-radius:12px;overflow:hidden;background:#eef2ff;display:grid;place-items:center;font-weight:900;color:#3730a3;flex:0 0 auto}
    .admin-logo img{width:100%;height:100%;object-fit:cover}


    .workflow-steps{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
    .workflow-step{font-size:10px;font-weight:800;padding:5px 7px;border-radius:999px;background:#f2f4f7;color:#667085;border:1px solid #e4e7ec}
    .workflow-step.done{background:#ecfdf3;color:#067647;border-color:#abefc6}
    .workflow-step.current{background:#fff4ed;color:#b93815;border-color:#ffd6ae}
    .shortlist-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;background:#eef4ff;color:#3538cd;border:1px solid #c7d7fe}


    .offer-box{border:1px solid #c7d7fe;background:#eef4ff;color:#3538cd;border-radius:14px;padding:12px;margin:12px 0}
    .offer-box.accepted{background:#ecfdf3;color:#067647;border-color:#abefc6}
    .offer-box.declined{background:#fef3f2;color:#b42318;border-color:#fecdca}
    .offer-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
    .offer-value{background:rgba(255,255,255,.62);border-radius:9px;padding:8px;font-size:12px}


    .final-state{border-radius:14px;padding:12px;margin:10px 0;font-size:12px;font-weight:700}
    .final-state.unsuccessful{background:#fef3f2;color:#b42318;border:1px solid #fecdca}
    .final-state.withdrawn{background:#f2f4f7;color:#475467;border:1px solid #e4e7ec}
    .final-state.hired{background:#ecfdf3;color:#067647;border:1px solid #abefc6}


    .notify-bell{position:relative;width:42px;height:42px;border-radius:9px;border:1px solid var(--line-dark);background:transparent;color:var(--paper);font-size:18px}
    .notify-count{position:absolute;right:-5px;top:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;border:2px solid var(--ink)}
    .notification-item{padding:12px 0;border-bottom:1px solid var(--line-light)}
    .notification-item:last-child{border-bottom:0}
    .notification-item.unread{font-weight:700}
    .notification-time{font-size:11px;color:var(--muted);margin-top:4px}
    .timeline{margin:12px 0;padding-left:8px}
    .timeline-item{position:relative;padding:0 0 14px 22px;border-left:2px solid #ddd6c4}
    .timeline-item:last-child{border-left-color:transparent;padding-bottom:0}
    .timeline-dot{position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--paper)}
    .timeline-title{font-size:12px;font-weight:900}
    .timeline-meta{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
    .job-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .job-status{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}
    .job-status.active{background:#ecfdf3;color:#067647}
    .job-status.paused{background:#fffaeb;color:#b54708}
    .job-status.closed{background:#f2f4f7;color:#475467}
    .applicant-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
    .pill.bad{background:var(--bad-tint);color:var(--bad)}


    .security-note{font-size:11px;line-height:1.45;color:var(--muted);margin-top:7px}
    .turnstile-wrap{margin-top:12px;min-height:65px}
    .turnstile-status{font-size:11px;line-height:1.4;color:var(--muted);margin-top:5px}
    .turnstile-status.ok{color:var(--good)}
    .turnstile-status.bad{color:var(--bad)}
    .auth-success{background:var(--good-tint);color:var(--good);border:1px solid #abefc6;border-radius:10px;padding:12px;margin:10px 0;font-size:12px;line-height:1.45}


    .safety-card{border:1px solid var(--line-light);border-radius:14px;padding:14px;margin-top:14px;background:#fff}
    .safety-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .privacy-toggle{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-light)}
    .privacy-toggle:last-child{border-bottom:0}
    .privacy-toggle input{width:auto;margin-top:3px}
    .report-status{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900;background:#f2f4f7}
    .report-status.open,.report-status.reviewing{background:#fffaeb;color:#b54708}
    .report-status.resolved{background:#ecfdf3;color:#067647}
    .report-status.dismissed{background:#f2f4f7;color:#475467}


    .analytics-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
    .analytics-period{display:flex;gap:6px;flex-wrap:wrap}
    .analytics-period button{border:1px solid var(--line-light);background:#fff;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800}
    .analytics-period button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
    .metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}

<body>
<div class="app">

</div>

  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
let state = {
  user:null,
  mode:null,
  tab:null,
  profile:{},
  jobs:[],
  applications:[],
  skipped:[],
  lastAction:null,
  postedJobs:[],
  applicants:[],
  notifications:[],
  account:{privacy:{shareEmail:1,shareCv:1,sharePhoto:1,shareLocation:1},consent:null,blocks:[],reports:[]},
  applicantFilters:{jobId:"all", status:"all"},
  admin:{overview:{}, verifications:[], users:[], jobs:[], reports:[], auditLog:[]},
  analyticsDays:30,
  adminAnalytics:null,
  employerAnalytics:null,
  analyticsLoading:false,
  commercial:null,
  adminCommercial:null,
  commercialLoading:false,
  authMode:"login",
  authRole:"jobseeker",
  authError:"",
  pendingEmail:"",
  resetToken:"",
  security:{
    turnstileSiteKey:"",
    turnstileEnabled:false,
    emailDeliveryConfigured:false,
    emailVerificationRequired:false
  },
  turnstileToken:"",
  turnstileWidgetId:null,
  feedFilters: (() => {
    try{
      return JSON.parse(localStorage.getItem("buisder_feed_filters")) || {
        category:"Any", maxDistance:25, minPay:"", employmentType:"Any",
        experience:"Any", availability:"Match profile"
      };
    }catch(e){
      return {category:"Any", maxDistance:25, minPay:"", employmentType:"Any", experience:"Any", availability:"Match profile"};
    }
  })()
};

let draftJobLat = null;
let draftJobLng = null;

function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }

function formatInterview(value){
  if(!value) return "";
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return value.replace("T"," ");
  return d.toLocaleString("en-IE", {
    weekday:"short", day:"numeric", month:"short", year:"numeric",
    hour:"2-digit", minute:"2-digit"
  });
}


function formatTimelineDate(value){
  if(!value) return "";
  const normalized = String(value).includes("T") ? String(value) : String(value).replace(" ","T") + "Z";
  const d = new Date(normalized);
  if(Number.isNaN(d.getTime())) return String(value);
  return d.toLocaleString("en-IE", {
    day:"numeric", month:"short", year:"numeric",
    hour:"2-digit", minute:"2-digit"
  });
}

function statusHistoryLabel(status){
  const map = {
    applied:"Applied",
    shortlisted:"Shortlisted",
    interview_invited:"Interview invited",
    interview_accepted:"Interview accepted",
    interview_declined:"Interview declined",
    interview_completed:"Interview completed",
    offer_made:"Offer made",
    offer_accepted:"Offer accepted",
    offer_declined:"Offer declined",
    hired:"Hired",
    unsuccessful:"Unsuccessful",
    withdrawn:"Withdrawn"
  };
  return map[status] || cap(String(status || "").replaceAll("_"," "));
}

function renderApplicationTimeline(a, viewer){
  const history = Array.isArray(a?.statusHistory) ? a.statusHistory : [];
  if(!history.length){
    return `<div class="notice">No timeline history is available for this application yet.</div>`;
  }

  return `
    <div class="timeline">
      ${history.map(h=>{
        let actor = "";
        if(h.actorUserId){
          if(viewer==="jobseeker"){
            actor = h.actorRole==="jobseeker" ? "You" : (h.actorRole==="employer" ? "Employer" : (h.actorName || "Buisder"));
          } else {
            actor = h.actorRole==="employer" ? "You / employer" : (h.actorRole==="jobseeker" ? (h.actorName || "Candidate") : (h.actorName || "Buisder"));
          }
        } else {
          actor = "Buisder";
        }
        return `
          <div class="timeline-item">
            <span class="timeline-dot"></span>
            <div class="timeline-title">${statusHistoryLabel(h.status)}</div>
            <div class="timeline-meta">${formatTimelineDate(h.createdAt)} · ${actor}</div>
            ${viewer==="employer" && h.note ? `<div class="timeline-meta">${h.note}</div>` : ""}
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function applicationStatusLabel(a){
  const status = a && a.status;
  if(status==="shortlisted") return "Shortlisted";
  if(status==="interview_invited" || status==="invited") return "Interview invited";
  if(status==="interview_accepted") return "Interview confirmed";
  if(status==="interview_declined") return "Interview declined";
  if(status==="interview_completed") return "Interview completed";
  if(status==="offer_made") return "Offer made";
  if(status==="offer_accepted") return "Offer accepted";
  if(status==="offer_declined") return "Offer declined";
  if(status==="hired") return "Hired";
  if(status==="unsuccessful") return "Unsuccessful";
  if(status==="withdrawn") return "Withdrawn";
  return "Applied";
}

function interviewStatusLabel(a){
  return applicationStatusLabel(a);
}

function applicationStatusClass(a){
  if(["shortlisted","interview_accepted","interview_completed","offer_accepted","hired"].includes(a.status)) return "good";
  if(["interview_declined","offer_declined","withdrawn"].includes(a.status)) return "soft";
  if(a.status==="unsuccessful") return "bad";
  return "soft";
}

function workflowStepClass(a, step){
  const order = {
    applied:0,
    shortlisted:1,
    interview_invited:2,
    invited:2,
    interview_accepted:3,
    interview_declined:3,
    interview_completed:4,
    offer_made:5,
    offer_accepted:6,
    offer_declined:6,
    hired:7
  };
  const here = order[a.status] ?? 0;
  const target = order[step];
  if(here > target) return "done";
  if(here === target) return "current";
  return "";
}

function renderWorkflowSteps(a){
  if(a.status==="unsuccessful"){
    return `<div class="final-state unsuccessful">Application closed · Unsuccessful</div>`;
  }
  if(a.status==="withdrawn"){
    return `<div class="final-state withdrawn">Application closed · Withdrawn</div>`;
  }

  const interviewOutcome = a.status==="interview_declined" ? "Interview declined" : "Interview accepted";
  const offerOutcome = a.status==="offer_declined" ? "Offer declined" : "Offer accepted";
  return `
    <div class="workflow-steps">
      <span class="workflow-step ${workflowStepClass(a,"applied")}">Applied</span>
      <span class="workflow-step ${workflowStepClass(a,"shortlisted")}">Shortlisted</span>
      <span class="workflow-step ${workflowStepClass(a,"interview_invited")}">Interview invited</span>
      <span class="workflow-step ${workflowStepClass(a,"interview_accepted")}">${interviewOutcome}</span>
      <span class="workflow-step ${workflowStepClass(a,"interview_completed")}">Interview complete</span>
      <span class="workflow-step ${workflowStepClass(a,"offer_made")}">Offer</span>
      <span class="workflow-step ${workflowStepClass(a,"offer_accepted")}">${offerOutcome}</span>
      <span class="workflow-step ${workflowStepClass(a,"hired")}">Hired</span>
    </div>
  `;
}

function unreadInterviewCount(){
  return state.applications.filter(a => a.interviewAt && !a.inviteSeenAt && (a.interviewStatus==="pending" || a.status==="interview_invited" || a.status==="invited")).length;
}

function unreadNotificationCount(){
  return (state.notifications || []).filter(n=>!n.readAt).length;
}

const shownBrowserNotificationIds = new Set();

async function enableBrowserNotifications(){
  if (!("Notification" in window)) {
    toast("Browser notifications are not supported on this device");
    return;
  }
  const permission = await Notification.requestPermission();
  if(permission === "granted"){
    toast("Browser notifications enabled");
    notifyUnreadNotifications();
  } else {
    toast("Notifications were not enabled");
  }
}

function notifyUnreadNotifications(){
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  for(const n of (state.notifications || [])){
    if(!n.readAt && !shownBrowserNotificationIds.has(n.id)){
      shownBrowserNotificationIds.add(n.id);
      new Notification(n.title || "Buisder update", {body:n.body || ""});
    }
  }
}

function renderNotificationBell(){
  const badge = document.getElementById("notifyCount");
  if(!badge) return;
  const count = unreadNotificationCount();
  badge.textContent = count > 99 ? "99+" : String(count);
  badge.classList.toggle("hidden", count === 0);
}

function openNotifications(){
  const items = state.notifications || [];
  openModal(`
    <div class="title-row" style="margin-top:0">
      <h2>Notifications</h2>
      <span>${unreadNotificationCount()} unread</span>
    </div>
    ${items.length ? `
      <button class="btn btn-outline btn-block" style="color:var(--ink);border-color:var(--line-light);margin-bottom:8px" onclick="markAllNotificationsRead()">Mark all read</button>
      <div>
        ${items.map(n=>`
          <div class="notification-item ${n.readAt ? "" : "unread"}" onclick="openNotification('${n.id}')">
            <div>${n.title}</div>
            <div class="small" style="margin-top:4px">${n.body}</div>
            <div class="notification-time">${formatTimelineDate(n.createdAt)}</div>
          </div>
        `).join("")}
      </div>
    ` : `<div class="notice">No notifications yet.</div>`}
    ${("Notification" in window && Notification.permission !== "granted")
      ? `<button class="btn btn-dark btn-block" style="margin-top:12px" onclick="enableBrowserNotifications()">Enable browser alerts</button>`
      : ""}
  `);
}

async function openNotification(id){
  const n = (state.notifications || []).find(x=>String(x.id)===String(id));
  if(!n) return;
  try{
    if(!n.readAt) await api(`/api/notifications/${id}`, {method:"POST"});
  }catch(e){}
  closeModal();
  await loadBootstrap();
  if(n.applicationId){
    state.tab = state.mode==="jobseeker" ? "applications" : state.mode==="employer" ? "applicants" : state.tab;
  }
  render();
}

async function markAllNotificationsRead(){
  try{
    await api("/api/notifications/read-all", {method:"POST"});
    await loadBootstrap();
    render();
    openNotifications();
  }catch(e){ toast(e.message); }
}


async function loadSecurityConfig(){
  try{
    const res = await fetch("/api/security/config", {credentials:"include", cache:"no-store"});
    if(res.ok){
      state.security = await res.json();
    } else {
      state.authError = "Buisder could not load its security configuration.";
    }
  }catch(e){
    state.authError = "Buisder could not load its security configuration.";
  }
}

function turnstileMarkup(){
  if(!state.security.turnstileSiteKey){
    return state.security.turnstileEnabled
      ? `<div class="notice" style="color:var(--bad)">Turnstile is enabled on the server, but TURNSTILE_SITE_KEY is not available to this deployment.</div>`
      : "";
  }
  return `
    <div class="turnstile-wrap">
      <div id="turnstileAuth"></div>
      <div id="turnstileStatus" class="turnstile-status">Loading security check…</div>
    </div>
  `;
}

function renderTurnstileWidget(){
  state.turnstileToken = "";
  state.turnstileWidgetId = null;
  if(!state.security.turnstileSiteKey) return;

  const target = document.getElementById("turnstileAuth");
  const status = document.getElementById("turnstileStatus");
  if(!target) return;

  const setStatus = (message, kind="")=>{
    const el = document.getElementById("turnstileStatus");
    if(!el) return;
    el.textContent = message;
    el.className = `turnstile-status ${kind}`;
  };

  let attempts = 0;
  const tryRender = ()=>{
    attempts += 1;

    if(!window.turnstile){
      if(attempts < 100){
        setStatus("Loading Cloudflare security check…");
        setTimeout(tryRender, 100);
      } else {
        setStatus("Cloudflare Turnstile script did not load.", "bad");
      }
      return;
    }

    try{
      // window.turnstile is already present because tryRender() polls for it.
      // Render directly. Do not call turnstile.ready() when api.js is loaded
      // with async/defer.
      state.turnstileWidgetId = turnstile.render(target, {
        sitekey: state.security.turnstileSiteKey,
        theme: "auto",
        callback: token => {
          state.turnstileToken = token;
          setStatus("Security check complete.", "ok");
        },
        "expired-callback": () => {
          state.turnstileToken = "";
          setStatus("Security check expired. Complete it again.", "bad");
        },
        "error-callback": code => {
          state.turnstileToken = "";
          setStatus(`Turnstile widget error${code ? `: ${code}` : ""}`, "bad");
        }
      });
      setStatus("Waiting for Cloudflare security check…");
    }catch(e){
      setStatus(`Turnstile could not render: ${e.message || e}`, "bad");
    }
  };

  tryRender();
}

function resetTurnstile(){
  state.turnstileToken = "";
  if(window.turnstile && state.turnstileWidgetId !== null){
    try{ turnstile.reset(state.turnstileWidgetId); }catch(e){}
  }
}

function authTurnstileToken(){
  // Do not stop the request in the browser. The server must always be
  // allowed to call Cloudflare Siteverify and decide whether to accept it.
  return state.turnstileToken || "";
}

async function processAuthLink(){
  const params = new URLSearchParams(location.search);
  const verifyToken = params.get("verify");
  const resetToken = params.get("reset");

  if(verifyToken){
    try{
      await api("/api/auth/verify-email", {method:"POST", body:{token:verifyToken}});
      history.replaceState({}, "", location.pathname);
      state.authError = "";
      return "verified";
    }catch(e){
      history.replaceState({}, "", location.pathname);
      state.user = null;
      state.authMode = "login";
      state.authError = e.message;
      return "failed";
    }
  }

  if(resetToken){
    state.user = null;
    state.resetToken = resetToken;
    state.authMode = "reset";
    history.replaceState({}, "", location.pathname);
    return "reset";
  }

  return null;
}


async function trackAnalytics(eventType, data={}){
  if(!state.user) return;
  try{
    await api("/api/analytics/event", {
      method:"POST",
      body:{eventType, ...data}
    });
  }catch(e){}
}

async function api(path, opts = {}){
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: opts.body ? { "Content-Type":"application/json" } : undefined,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    credentials:"include"
  });

  const raw = await res.text();
  let data = null;
  try{ data = raw ? JSON.parse(raw) : null; } catch(e){}

  if(!res.ok){
    const message =
      (data && (data.error || data.message)) ||
      (raw && raw.length < 500 ? raw : "") ||
      `Buisder server error (${res.status})`;

    const detail = data && data.detail ? ` ${data.detail}` : "";
    throw new Error(`${message}${detail}`.trim());
  }

  return data;
}

async function loadBootstrap(){
  const data = await api("/api/bootstrap");
  state.user = data.user;
  if(!data.user) return;

  state.mode = data.user.isAdmin ? "admin" : data.user.role;

  const validTab = state.mode==="jobseeker"
    ? ["feed","applications","profile"].includes(state.tab)
    : state.mode==="employer"
      ? ["home","employer-analytics","commercial","post","applicants","profile"].includes(state.tab)
      : ["admin-home","admin-analytics","admin-commercial","verifications","admin-users","admin-jobs","admin-reports"].includes(state.tab);

  if(!validTab){
    state.tab = state.mode==="jobseeker" ? "feed" : (state.mode==="employer" ? "home" : "admin-home");
  }

  if(state.mode==="admin"){
    state.admin = data.admin || {overview:{}, verifications:[], users:[], jobs:[], reports:[], auditLog:[]};
    state.notifications = data.notifications || [];
    state.profile = {};
    state.jobs = [];
    state.applications = [];
    state.skipped = [];
    state.postedJobs = [];
    state.applicants = [];
    return;
  }

  state.profile = data.profile || {};
  state.notifications = data.notifications || [];
  state.account = data.account || {privacy:{shareEmail:1,shareCv:1,sharePhoto:1,shareLocation:1},consent:null,blocks:[],reports:[]};
  state.commercial = data.commercial || null;
  if(state.mode==="jobseeker"){
    state.jobs = data.jobs || [];
    state.applications = data.applications || [];
    state.skipped = data.skipped || [];
    setTimeout(notifyUnreadNotifications, 50);
  } else {
    state.postedJobs = data.postedJobs || [];
    state.applicants = data.applicants || [];
  }
}

async function boot(){
  await loadSecurityConfig();
  const authLink = await processAuthLink();

  if(authLink !== "reset"){
    try{ await loadBootstrap(); } catch(e){ state.user = null; }
  }

  render();
  if(state.user) trackAnalytics("app_open");

  setInterval(async ()=>{
    if(!state.user) return;
    try{
      const before = unreadNotificationCount();
      await loadBootstrap();
      const after = unreadNotificationCount();
      if(after !== before) render();
      notifyUnreadNotifications();
    }catch(e){}
  }, 20000);
}

async function setTab(tab){
  state.tab = tab;
  render();

  if(tab==="admin-analytics" && state.mode==="admin"){
    await loadAdminAnalytics();
  }
  if(tab==="admin-commercial" && state.mode==="admin"){
    await loadAdminCommercial();
  }
  if(tab==="employer-analytics" && state.mode==="employer"){
    await loadEmployerAnalytics();
  }

  if(tab==="applications" && state.mode==="jobseeker"){
    const unseen = state.applications.filter(a => a.interviewAt && !a.inviteSeenAt);
    for(const a of unseen){
      try{
        await api(`/api/applications/${a.id}/seen`, {method:"POST"});
        a.inviteSeenAt = new Date().toISOString();
      } catch(e){}
    }
    render();
  }
}

function renderAuth(){
  const errBox = state.authError ? `<div class="notice" style="color:var(--bad)">${state.authError}</div>` : "";

  if(state.authMode === "verify-pending"){
    return `
      <div class="hero">
        <h1>Check your email</h1>
        <p>Verify your email address before logging in to Buisder.</p>
      </div>
      <div class="section-pad">
        <div class="form-card">
          <div class="auth-success">
            We sent a verification link to <strong>${state.pendingEmail || "your email address"}</strong>.
            The link expires in 24 hours.
          </div>
          ${!state.security.emailDeliveryConfigured ? `<div class="notice">Email delivery is not configured yet. Configure it before enforcing email verification.</div>` : ""}
          ${turnstileMarkup()}
          ${errBox}
          <button class="btn btn-dark btn-block" style="margin-top:12px" onclick="doResendVerification()">Resend verification email</button>
          <button class="btn btn-outline btn-block" style="margin-top:8px" onclick="state.authMode='login';state.authError='';render()">Back to login</button>
        </div>
      </div>
    `;
  }

  if(state.authMode === "forgot"){
    return `
      <div class="hero">
        <h1>Reset your password</h1>
        <p>Enter your email and we’ll send a password-reset link.</p>
      </div>
      <div class="section-pad">
        <div class="form-card">
          <label>Email</label>
          <input id="authEmail" type="email" placeholder="you@example.com">
          ${turnstileMarkup()}
          ${errBox}
          ${!state.security.emailDeliveryConfigured ? `<div class="notice">Password-reset email delivery has not been configured yet.</div>` : ""}
          <button class="btn btn-dark btn-block" style="margin-top:12px" onclick="doForgotPassword()">Send reset link</button>

          <div class="privacy-toggle" style="margin-top:10px">

        </div>
        ${state.security.emailVerificationRequired ? `<div class="small" style="margin-top:8px;text-align:center"><a href="#" onclick="state.pendingEmail=document.getElementById('authEmail')?.value.trim()||state.pendingEmail;state.authMode='verify-pending';state.authError='';render();return false" style="color:var(--accent-ink)">Resend verification email</a></div>` : ""}
        <div class="small" style="margin-top:12px;text-align:center">New here? <a href="#" onclick="state.authMode='signup';state.authError='';render();return false" style="color:var(--accent-ink)">Create an account</a></div>

async function doSignup(){
  const name = document.getElementById("authName").value.trim();
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  try{
    const turnstileToken = authTurnstileToken();
    const result = await api("/api/auth/signup", {
      method:"POST",
      body:{
        name, email, password, role:state.authRole, turnstileToken,
        acceptedTerms:Boolean(document.getElementById("authTerms")?.checked),
        acceptedPrivacy:Boolean(document.getElementById("authPrivacy")?.checked),
        eligibilityConfirmed:Boolean(document.getElementById("authEligibility")?.checked)
      }
    });

    state.authError = "";
    state.pendingEmail = email;

    if(result.verificationRequired){
      state.authMode = "verify-pending";
      render();
      return;
    }

    await loadBootstrap();
    render();
  } catch(e){
    state.authError = e.message;
    resetTurnstile();
    render();
  }
}

async function doLogin(){
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  try{
    const turnstileToken = authTurnstileToken();
    await api("/api/auth/login", {method:"POST", body:{email, password, turnstileToken}});
    state.pendingEmail = email;
    state.authError = "";
    await loadBootstrap();
    render();
  } catch(e){
    state.pendingEmail = email;
    state.authError = e.message;
    if(String(e.message).toLowerCase().includes("verify your email")){
      state.authMode = "verify-pending";
    }
    resetTurnstile();
    render();
  }
}

async function doForgotPassword(){
  const email = document.getElementById("authEmail").value.trim();
  try{
    const turnstileToken = authTurnstileToken();
    await api("/api/auth/forgot-password", {method:"POST", body:{email, turnstileToken}});
    state.pendingEmail = email;
    state.authError = "";
    toast("If the account exists, a reset email has been sent");
    state.authMode = "login";
    render();
  } catch(e){
    state.authError = e.message;
    resetTurnstile();
    render();
  }
}

async function doResetPassword(){
  const password = document.getElementById("resetPassword").value;
  const confirmPassword = document.getElementById("resetPassword2").value;

  if(password !== confirmPassword){
    state.authError = "Passwords do not match";
    render();
    return;
  }

  try{
    await api("/api/auth/reset-password", {
      method:"POST",
      body:{token:state.resetToken, password}
    });
    state.resetToken = "";
    state.authError = "";
    state.authMode = "login";
    toast("Password reset. Log in with your new password.");
    render();
  }catch(e){
    state.authError = e.message;
    render();
  }
}

async function doResendVerification(){
  const email = state.pendingEmail || "";
  if(!email){
    state.authError = "Enter your email on the login screen first";
    state.authMode = "login";
    render();
    return;
  }

  try{
    const turnstileToken = authTurnstileToken();
    await api("/api/auth/resend-verification", {
      method:"POST",
      body:{email, turnstileToken}
    });
    state.authError = "";
    toast("If verification is needed, a new email has been sent");
    resetTurnstile();
  }catch(e){
    state.authError = e.message;
    resetTurnstile();
    render();
  }
}

async function doLogout(){
  try{ await api("/api/auth/logout", {method:"POST"}); } catch(e){}
  state.user = null;
  state.tab = null;
  state.authMode = "login";
  render();
}

  const nav = document.getElementById("bottomnav");

  const items = state.mode==="jobseeker"

function normalizeList(value){
  if(Array.isArray(value)) return value.map(v=>String(v).trim().toLowerCase()).filter(Boolean);
  return String(value || "").split(",").map(v=>v.trim().toLowerCase()).filter(Boolean);
}

function parsePay(job){
  if(job.pay_min !== null && job.pay_min !== undefined && job.pay_min !== "") return Number(job.pay_min) || 0;
  const match = String(job.pay || "").replace(",", ".").match(/(\d+(?:\.\d+)?)/);
  return match ? Number(match[1]) : 0;
}

function ageBandMinimum(ageBand){
  const match = String(ageBand || "").match(/(\d+)/);
  return match ? Number(match[1]) : 0;
}

function haversineKm(lat1, lon1, lat2, lon2){
  const vals = [lat1,lon1,lat2,lon2].map(Number);
  if(vals.some(v=>!Number.isFinite(v))) return null;
  const [a,b,c,d] = vals;
  const R = 6371;
  const toRad = x => x * Math.PI / 180;
  const dLat = toRad(c-a), dLon = toRad(d-b);
  const q = Math.sin(dLat/2)**2 + Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(q));
}

function scheduleOverlap(job){
  const wanted = normalizeList(state.profile.availability);
  const offered = normalizeList(job.schedule_tags);
  if(!wanted.length || !offered.length) return null;
  const synonyms = {
    "sat":"saturday","sun":"sunday","weekend":"saturday","weekends":"saturday",
    "evening":"evenings","holiday":"holidays","school/college holidays":"holidays"
  };
  const normal = x => synonyms[x] || x;
  const w = wanted.map(normal);
  const o = offered.map(normal);
  return w.some(x => o.some(y => x.includes(y) || y.includes(x)));
}

function categoryFor(job){
  return (job.tags && job.tags[0]) || "General";
}

function jobDistance(job){
  return haversineKm(
    state.profile.latitude, state.profile.longitude,
    job.latitude, job.longitude
  );
}

function ageEligible(job){
  const candidateMin = ageBandMinimum(state.profile.age_band);
  const required = Number(job.min_age || 16);
  if(!candidateMin) return true;
  return candidateMin >= required;
}

function scoreJob(job){
  let score = 0;
  let weight = 0;

  // Category / interests: 25
  const interests = normalizeList(state.profile.interests);
  const category = categoryFor(job).toLowerCase();
  weight += 25;
  if(!interests.length) score += 12;
  else if(interests.some(x => category.includes(x) || x.includes(category))) score += 25;

  // Availability: 20
  weight += 20;
  const overlap = scheduleOverlap(job);
  if(overlap === true) score += 20;
  else if(overlap === null) score += 10;

  // Distance / location: 20
  weight += 20;
  const distance = jobDistance(job);
  const maxDistance = Number(state.feedFilters.maxDistance || state.profile.max_distance_km || 25);
  if(distance !== null){
    if(distance <= Math.max(5,maxDistance*.25)) score += 20;
    else if(distance <= Math.max(10,maxDistance*.6)) score += 16;
    else if(distance <= maxDistance) score += 10;
  } else {
    const pl = String(state.profile.location || "").toLowerCase();
    const jl = String(job.location || "").toLowerCase();
    if(pl && jl && (pl.includes(jl) || jl.includes(pl))) score += 16;
    else score += 8;
  }

  // Pay: 15
  weight += 15;
  const pay = parsePay(job);
  const minPay = Number(state.feedFilters.minPay || state.profile.min_pay || 0);
  if(!minPay) score += pay ? 12 : 8;
  else if(pay >= minPay) score += 15;

  // Employment type: 10
  weight += 10;
  const preferredType = state.profile.preferred_employment_type || "Any";
  if(preferredType === "Any") score += 7;
  else if(job.employment_type === preferredType) score += 10;

  // Experience: 10
  weight += 10;
  const exp = String(job.experience || "None");
  if(exp === "None") score += 10;
  else if(exp === "Helpful") score += 7;
  else score += 3;

  return Math.max(0, Math.min(100, Math.round(score / weight * 100)));
}

function currentFeedJobs(){
  const f = state.feedFilters || {};
  const minPay = Number(f.minPay || 0);
  const maxDistance = Number(f.maxDistance || 0);

  return state.jobs
    .filter(j => !state.applications.some(a=>a.jobId===j.id) && !state.skipped.includes(j.id))
    .filter(ageEligible)
    .filter(j => f.category==="Any" || categoryFor(j)===f.category)
    .filter(j => f.employmentType==="Any" || (j.employment_type || "Part-time")===f.employmentType)
    .filter(j => f.experience==="Any" || (f.experience==="None required" ? (j.experience || "None")==="None" : (j.experience || "None")!== "Required"))
    .filter(j => !minPay || !parsePay(j) || parsePay(j) >= minPay)
    .filter(j => {
      if(f.availability!=="Match profile") return true;
      const overlap = scheduleOverlap(j);
      return overlap !== false;
    })
    .filter(j => {
      if(!maxDistance) return true;
      const distance = jobDistance(j);
      return distance === null || distance <= maxDistance;
    })
    .map(j => ({...j, _matchScore:scoreJob(j), _distance:jobDistance(j)}))
    .sort((a,b) => {
      const featuredDelta = Number(Boolean(b.is_featured)) - Number(Boolean(a.is_featured));
      if(featuredDelta) return featuredDelta;
      return b._matchScore - a._matchScore;
    });
}

function saveFeedFilters(){
  try{ localStorage.setItem("buisder_feed_filters", JSON.stringify(state.feedFilters)); }catch(e){}
}

function activeFilterLabels(){
  const f = state.feedFilters;
  const out = [];
  if(f.category!=="Any") out.push(f.category);
  if(f.employmentType!=="Any") out.push(f.employmentType);
  if(f.experience!=="Any") out.push(f.experience);
  if(f.minPay) out.push(`€${f.minPay}+/hr`);
  if(f.maxDistance) out.push(`${f.maxDistance} km`);
  if(f.availability==="Match profile") out.push("My availability");
  return out;
}

      <button class="btn btn-bad" onclick="clearJobFilters()">Clear</button>
      <button class="btn btn-dark" onclick="applyJobFilters()">Apply filters</button>
    </div>
  `);

function renderSwipeCard(job, remaining){

            <div class="job-badge">${industry}</div>
            ${job.is_featured ? `<span class="commercial-badge featured">Featured</span>` : ""}
          </div>

          <span class="chip good">No CV needed</span>

          <span class="chip">${job.employment_type || "Part-time"}</span>
          <span class="chip">${Number(job.min_age || 16)}+</span>
          ${job._distance !== null && job._distance !== undefined ? `<span class="chip">${job._distance.toFixed(1)} km away</span>` : ""}
        </div>
        <div class="grid">
          <div class="metric"><small>Pay</small><strong>${job.pay || "On request"}</strong></div>
          <div class="metric"><small>Hours</small><strong>${job.hours || "Flexible"}</strong></div>
          <div class="metric"><small>Experience</small><strong>${job.experience || "None"}</strong></div>
          <div class="metric"><small>Start</small><strong>${job.start_date || "To be agreed"}</strong></div>
        </div>
        ${job.description ? `<div class="why"><strong>About the role:</strong> ${job.description}</div>` : ""}
        <div class="swipe-actions">
          <button class="big-action skip" onclick="skipCurrent()" aria-label="Skip this job">Skip</button>
          <button class="big-action details" onclick="showJob('${job.id}')" aria-label="View job details">Details</button>
          <button class="big-action accept" onclick="acceptCurrent()" aria-label="Apply to this job">Apply</button>
        </div>
        <div style="margin-top:12px;font-size:12px;color:#667085">${remaining} jobs remaining in the current feed.</div>

async function prepareProfilePhotoFile(file){
  if(!file) return null;
  if(!file.type || !file.type.startsWith("image/")) throw new Error("Please choose an image file");
  if(file.size > 5 * 1024 * 1024) throw new Error("Image must be under 5 MB");

  const dataUrl = await new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(new Error("Could not read image"));
    reader.readAsDataURL(file);
  });

  const img = await new Promise((resolve, reject)=>{
    const i = new Image();
    i.onload = ()=>resolve(i);
    i.onerror = ()=>reject(new Error("Could not load image"));
    i.src = dataUrl;
  });

  const size = 480;
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  const side = Math.min(img.width, img.height);
  const sx = (img.width - side) / 2;
  const sy = (img.height - side) / 2;
  ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);

  const canvasBlob = quality => new Promise((resolve, reject)=>{
    canvas.toBlob(
      blob => blob ? resolve(blob) : reject(new Error("Could not prepare image")),
      "image/jpeg",
      quality
    );
  });

  let quality = .82;
  let blob = await canvasBlob(quality);
  while(blob.size > 600 * 1024 && quality > .45){
    quality -= .08;
    blob = await canvasBlob(quality);
  }
  return blob;
}

async function uploadR2File(kind, file, filename){
  if(!file) return null;
  const form = new FormData();
  form.append("kind", kind);
  form.append("file", file, filename || file.name || "file");

  const res = await fetch("/api/files/upload", {
    method:"POST",
    body:form,
    credentials:"include"
  });

  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw new Error((data && data.error) || "File upload failed");
  return data;
}

function captureProfileLocation(){
  if(!navigator.geolocation){ toast("Location is not supported on this device"); return; }
  const el = document.getElementById("profileGeoStatus");
  if(el) el.textContent = "Getting location…";
  navigator.geolocation.getCurrentPosition(
    pos => {
      state.profile.latitude = pos.coords.latitude;
      state.profile.longitude = pos.coords.longitude;
      if(el) el.textContent = "Location saved for distance matching. It will be stored when you save your profile.";
      toast("Location captured");
    },
    () => {
      if(el) el.textContent = "Could not access location. You can continue without it.";
      toast("Location permission was not granted");
    },
    {enableHighAccuracy:false, timeout:10000, maximumAge:300000}
  );
}

      toast("Uploading CV securely…");

      ageBand: document.getElementById("page").value,

function adminStatusBadge(status){
  if(status==="verified") return `<span class="pill good">Verified</span>`;

function analyticsPeriodLabel(days){
  return days===0 ? "All time" : `${days} days`;
}

function analyticsPct(value){
  return `${Number(value || 0).toFixed(Number(value || 0)%1 ? 1 : 0)}%`;
}

function metricValue(value, suffix=""){
  if(value===null || value===undefined || Number.isNaN(Number(value))) return "—";
  return `${value}${suffix}`;
}

function renderAnalyticsPeriodButtons(scope){
  return `
    <div class="analytics-period">
      ${[7,30,90,365,0].map(d=>`
        <button class="${state.analyticsDays===d?"active":""}" onclick="changeAnalyticsPeriod(${d},'${scope}')">
          ${d===0?"All":d+"d"}
        </button>
      `).join("")}
    </div>
  `;
}

async function changeAnalyticsPeriod(days, scope){
  state.analyticsDays = days;
  if(scope==="admin") await loadAdminAnalytics(true);
  else await loadEmployerAnalytics(true);
}

async function loadAdminAnalytics(force=false){
  if(state.analyticsLoading) return;
  if(state.adminAnalytics && !force) return;
  state.analyticsLoading = true;
  render();
  try{
    state.adminAnalytics = await api(`/api/admin/analytics?days=${state.analyticsDays}`);
  }catch(e){
    state.adminAnalytics = {error:e.message};
  }finally{
    state.analyticsLoading = false;
    render();
  }
}

async function loadEmployerAnalytics(force=false){
  if(state.analyticsLoading) return;

    state.employerAnalytics = await api(`/api/employer/analytics?days=${state.analyticsDays}`);

function renderFunnel(rows){
  const max = Math.max(1, ...rows.map(r=>Number(r.value || 0)));
  return rows.map(r=>`
    <div class="funnel-row">
      <div class="funnel-label">${r.label}</div>
      <div class="funnel-track"><div class="funnel-fill" style="width:${Math.max(2,Math.round(Number(r.value||0)/max*100))}%"></div></div>
      <div class="funnel-value">${Number(r.value || 0)}</div>
    </div>
  `).join("");
}

function renderTrend(trend){
  const rows = Array.isArray(trend) ? trend : [];
  const max = Math.max(1, ...rows.flatMap(r=>[Number(r.signups||0),Number(r.applications||0),Number(r.hires||0)]));
  return `
    <div class="trend-grid" title="14-day trend: applications, signups and hires">
      ${rows.map(r=>`
        <div class="trend-day" title="${r.day}: ${r.applications} applications, ${r.signups} signups, ${r.hires} hires">
          <div class="trend-bar goodbar" style="height:${Math.max(2,Number(r.hires||0)/max*80)}px"></div>
          <div class="trend-bar secondary" style="height:${Math.max(2,Number(r.signups||0)/max*80)}px"></div>
          <div class="trend-bar" style="height:${Math.max(2,Number(r.applications||0)/max*80)}px"></div>
        </div>
      `).join("")}
    </div>
    <div class="analytics-note">Each day shows applications, signups and hires. Hover a bar group for exact values.</div>
  `;
}

function adminAnalyticsCsv(){
  const a = state.adminAnalytics;
  if(!a || a.error) return;
  const rows = [
    ["Metric","Value"],
    ["Period", analyticsPeriodLabel(a.period?.days)],
    ["New users",a.kpis?.newUsers||0],
    ["New job seekers",a.kpis?.newJobseekers||0],
    ["New employers",a.kpis?.newEmployers||0],
    ["Profile completion rate",analyticsPct(a.kpis?.profileCompletionRate)],
    ["Jobs posted",a.kpis?.jobsPosted||0],
    ["Active jobs",a.kpis?.activeJobs||0],
    ["Applications",a.funnel?.applications||0],
    ["Shortlisted",a.funnel?.shortlisted||0],
    ["Interview invited",a.funnel?.interviewInvited||0],
    ["Offers",a.funnel?.offers||0],
    ["Hired",a.funnel?.hired||0],
    ["Application to hire",analyticsPct(a.rates?.applicationToHire)],
    ["Offer acceptance",analyticsPct(a.rates?.offerAcceptance)],
    ["Employer posting to hire",analyticsPct(a.rates?.employerHireConversion)],
    ["Average days to hire",a.kpis?.avgDaysToHire ?? ""]
  ];
  const csv = rows.map(row=>row.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = `buisder-pilot-metrics-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

function moneyFromCents(cents){
  if(cents===null || cents===undefined) return "Price not set";
  return `€${(Number(cents)/100).toFixed(Number(cents)%100 ? 2 : 0)}/month`;
}

function commercialPrice(plan){
  if(!plan) return "";
  if(plan.priceMode==="free") return "€0/month";
  if(plan.priceMode==="unset") return "Price not set";
  return moneyFromCents(plan.monthlyPriceCents);
}

function planUsagePercent(value, limit){
  if(Number(limit)<0) return 0;
  if(!Number(limit)) return value ? 100 : 0;
  return Math.min(100, Math.round(Number(value||0)/Number(limit)*100));
}

function commercialEndLabel(value){
  if(!value) return "No scheduled end date";
  return `Access ends ${formatTimelineDate(value)}`;
}

function captureJobLocation(){
  if(!navigator.geolocation){ toast("Location is not supported on this device"); return; }
  const el = document.getElementById("jobGeoStatus");
  if(el) el.textContent = "Getting workplace location…";
  navigator.geolocation.getCurrentPosition(
    pos => {
      draftJobLat = pos.coords.latitude;
      draftJobLng = pos.coords.longitude;
      if(el) el.textContent = "Workplace location captured for distance matching.";
      toast("Workplace location captured");
    },
    () => {
      if(el) el.textContent = "Could not access location. You can still post the job.";
      toast("Location permission was not granted");
    },
    {enableHighAccuracy:false, timeout:10000, maximumAge:300000}
  );
}

async function postJob(){
  const title = document.getElementById("jtitle").value.trim();
  if(!title){ toast("Add a job title"); return; }
  const scheduleTags = document.getElementById("jschedule").value
    .split(",").map(x=>x.trim()).filter(Boolean);

  const body = {
    title,
    location: document.getElementById("jlocation").value || "Cork",
    pay: document.getElementById("jpay").value || "Pay shown on request",
    payMin: document.getElementById("jpaymin").value,
    hours: document.getElementById("jhours").value || "Flexible",
    experience: document.getElementById("jexp").value,
    employmentType: document.getElementById("jemployment").value,
    minAge: Number(document.getElementById("jminage").value),
    scheduleTags,
    latitude: draftJobLat,
    longitude: draftJobLng,
    startDate: document.getElementById("jstart").value || "To be agreed",
    description: document.getElementById("jdescription").value || "",
    tags: [document.getElementById("jindustry").value]
  };
  try{
    await api("/api/jobs", {method:"POST", body});
    draftJobLat = null;
    draftJobLng = null;
    await loadBootstrap();
    state.tab = "home";
    render();
    toast("Job published");
  } catch(e){ toast(e.message); }
}

function applicantMatchesStatus(a, filter){
  if(filter==="all") return true;
  if(filter==="active") return !["hired","unsuccessful","withdrawn"].includes(a.status);
  if(filter==="interviews") return ["interview_invited","interview_accepted","interview_declined","interview_completed"].includes(a.status);
  if(filter==="offers") return ["offer_made","offer_accepted","offer_declined"].includes(a.status);
  if(filter==="closed") return ["hired","unsuccessful","withdrawn"].includes(a.status);
  return a.status===filter;
}

        </select>
        <select onchange="setApplicantFilter('status', this.value)">
          <option value="all" ${f.status==="all" ? "selected" : ""}>All stages</option>
          <option value="active" ${f.status==="active" ? "selected" : ""}>Active</option>
          <option value="shortlisted" ${f.status==="shortlisted" ? "selected" : ""}>Shortlisted</option>
          <option value="interviews" ${f.status==="interviews" ? "selected" : ""}>Interviews</option>
          <option value="offers" ${f.status==="offers" ? "selected" : ""}>Offers</option>
          <option value="hired" ${f.status==="hired" ? "selected" : ""}>Hired</option>
          <option value="closed" ${f.status==="closed" ? "selected" : ""}>Closed</option>
        </select>
      </div>
      ${!filteredApplicants.length ? `
        <div class="card dark empty">
          <h3 style="margin:0 0 8px">No applicants yet</h3>

        <div class="card list-card">

            ${a.applicantPhoto ? `<div class="applicant-photo"><img src="${a.applicantPhoto}" alt="Applicant photo"></div>` : `<div class="applicant-photo">${(a.applicantName || a.applicantEmail || "U").slice(0,1).toUpperCase()}</div>`}
            <div style="flex:1">
              <div style="font-weight:900">${a.applicantName || a.applicantEmail}</div>
              <div class="small">Applied to ${a.jobTitle}</div>
              <div class="small">${a.applicantLocation || "Location not set"} · ${a.applicantAvailability || "Availability not set"}</div>
            </div>
            <span class="pill ${applicationStatusClass(a)}">${applicationStatusLabel(a)}</span>
          </div>

          <div class="chips">
            <span class="chip">${a.applicantSkills || "No skills listed"}</span>
            ${a.status==="shortlisted" ? `<span class="shortlist-badge">★ Shortlisted</span>` : ""}
          </div>
          ${renderWorkflowSteps(a)}
          <details style="margin:10px 0">
            <summary style="font-size:12px;font-weight:800;cursor:pointer">Application timeline</summary>
            ${renderApplicationTimeline(a, "employer")}
          </details>

          ${a.offerStatus ? `
      <div class="offer-box ${a.offerStatus}">
        <strong>${a.offerStatus==="accepted" ? "Offer accepted" : a.offerStatus==="declined" ? "Offer declined" : "Offer sent"}</strong>
        <div class="offer-grid">
          <div class="offer-value"><strong>Role</strong><br>${a.offerRoleTitle || a.jobTitle}</div>
          <div class="offer-value"><strong>Pay</strong><br>${a.offerPay || ""}</div>
          <div class="offer-value"><strong>Start</strong><br>${a.offerStartDate || ""}</div>
          <div class="offer-value"><strong>Status</strong><br>${cap(a.offerStatus)}</div>
        </div>
        ${a.offerMessage ? `<div style="margin-top:9px">${a.offerMessage}</div>` : ""}
      </div>
    ` : ""}

    ${a.status==="interview_completed" ? `
      <button class="btn btn-good btn-block" style="margin-top:8px" onclick="closeModal(); openOffer('${a.id}')">Make job offer</button>
    ` : ""}
    ${["offer_made","offer_declined"].includes(a.status) ? `
      <button class="btn btn-outline btn-block" style="margin-top:8px" onclick="closeModal(); openOffer('${a.id}')">${a.status==="offer_declined" ? "Send revised offer" : "Edit offer"}</button>
    ` : ""}
    ${a.status==="offer_accepted" ? `
      <button class="btn btn-good btn-block" style="margin-top:8px" onclick="closeModal(); markHired('${a.id}')">Mark as hired</button>
    ` : ""}
    ${a.status==="hired" ? `<div class="offer-box accepted"><strong>Hired</strong></div>` : ""}

    ${a.status==="unsuccessful" ? `<div class="final-state unsuccessful">Application closed · Unsuccessful</div>` : ""}
    ${a.status==="withdrawn" ? `<div class="final-state withdrawn">Candidate withdrew this application.</div>` : ""}
    ${a.status==="hired" ? `<div class="final-state hired">Application closed · Hired</div>` : ""}

    ${!["hired","unsuccessful","withdrawn","offer_accepted"].includes(a.status) ? `
      <button class="btn btn-bad btn-block" style="margin-bottom:8px" onclick="closeModal(); openMarkUnsuccessful('${a.id}')">Mark unsuccessful</button>
    ` : ""}

    ${["applied","shortlisted"].includes(a.status) ? `
            <div style="margin-top:10px">
              <button class="btn ${a.status==="shortlisted" ? "btn-outline" : "btn-good"} btn-block"
                onclick="setShortlist('${a.id}', ${a.status==="shortlisted" ? "false" : "true"})">
                ${a.status==="shortlisted" ? "Remove from shortlist" : "Shortlist candidate"}
              </button>
            </div>
          ` : ""}

          ${a.interviewAt ? `
            <div class="interview-box ${a.interviewStatus==="declined" ? "declined" : (a.interviewStatus==="accepted" ? "" : "pending")}">
              <strong>${a.status==="interview_completed" ? "Interview completed" : a.interviewStatus==="accepted" ? "Candidate accepted" : a.interviewStatus==="declined" ? "Candidate declined" : "Interview invitation sent"}</strong>
              <div style="margin-top:6px"><strong>Date & time:</strong> ${formatInterview(a.interviewAt)}</div>
              ${a.interviewLocation ? `<div style="margin-top:4px"><strong>Place:</strong> ${a.interviewLocation}</div>` : ""}
              ${a.interviewMessage ? `<div style="margin-top:4px"><strong>Message:</strong> ${a.interviewMessage}</div>` : ""}
            </div>
          ` : ""}

          ${a.status==="applied" ? `
            <div class="notice" style="margin-top:12px"><strong>Shortlist first.</strong> Move this candidate to the shortlist before inviting them to interview.</div>
          ` : ["shortlisted","interview_invited","interview_accepted","interview_declined","interview_completed"].includes(a.status) ? `
          <div style="margin-top:14px;border-top:1px solid #e5e7eb;padding-top:14px">
            <div style="font-weight:900;margin-bottom:8px">${a.interviewAt ? "Interview stage" : "Invite shortlisted candidate to interview"}</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
              <div>
                <label>Date</label>
                <input id="ivDate-${a.id}" type="date" value="${a.interviewAt ? a.interviewAt.slice(0,10) : ""}">
              </div>
              <div>
                <label>Time</label>
                <input id="ivTime-${a.id}" type="time" value="${a.interviewAt ? a.interviewAt.slice(11,16) : ""}">
              </div>
            </div>
            <label>Place / meeting method</label>
            <input id="ivPlace-${a.id}" value="${a.interviewLocation || ""}" placeholder="e.g. Main Street store, Teams, phone call">
            <label>Message to job seeker (optional)</label>
            <textarea id="ivMessage-${a.id}" placeholder="e.g. Please ask for Sarah at reception.">${a.interviewMessage || ""}</textarea>
            <button class="btn btn-dark btn-block" style="margin-top:10px" onclick="sendInlineInterviewInvite('${a.id}')">
              ${a.interviewAt ? "Update interview invitation" : "Send interview invitation"}
            </button>
          </div>
          ` : ""}

          ${a.status==="interview_accepted" ? `
            <button class="btn btn-good btn-block" style="margin-top:10px" onclick="markInterviewCompleted('${a.id}')">Mark interview completed</button>
          ` : ""}
          ${a.status==="interview_completed" ? `
            <div class="notice" style="margin-top:10px"><strong>Interview completed.</strong> This candidate is ready for the next hiring stage.</div>
          ` : ""}
          ${a.status==="interview_completed" ? `
            <button class="btn btn-good btn-block" style="margin-top:10px" onclick="openOffer('${a.id}')">Make job offer</button>
          ` : ""}

          ${a.offerStatus ? `
            <div class="offer-box ${a.offerStatus}">
              <strong>${a.offerStatus==="accepted" ? "Candidate accepted offer" : a.offerStatus==="declined" ? "Candidate declined offer" : "Offer awaiting candidate response"}</strong>
              <div class="offer-grid">
                <div class="offer-value"><strong>Role</strong><br>${a.offerRoleTitle || a.jobTitle}</div>
                <div class="offer-value"><strong>Pay</strong><br>${a.offerPay || ""}</div>
                <div class="offer-value"><strong>Start</strong><br>${a.offerStartDate || ""}</div>
                <div class="offer-value"><strong>Status</strong><br>${cap(a.offerStatus)}</div>
              </div>
              ${a.offerMessage ? `<div style="margin-top:9px">${a.offerMessage}</div>` : ""}
            </div>
          ` : ""}

          ${a.status==="offer_made" ? `
            <button class="btn btn-outline btn-block" onclick="openOffer('${a.id}')">Edit / resend offer</button>
          ` : ""}

          ${a.status==="offer_declined" ? `
            <button class="btn btn-outline btn-block" onclick="openOffer('${a.id}')">Send revised offer</button>
          ` : ""}

          ${a.status==="offer_accepted" ? `
            <button class="btn btn-good btn-block" onclick="markHired('${a.id}')">Mark as hired</button>
          ` : ""}

          ${a.status==="hired" ? `
            <div class="offer-box accepted"><strong>Hired</strong><div style="margin-top:5px">The candidate accepted the offer and has been marked hired.</div></div>
          ` : ""}

          ${a.status==="unsuccessful" ? `
            <div class="final-state unsuccessful">Application closed · Unsuccessful</div>
          ` : ""}
          ${a.status==="withdrawn" ? `
            <div class="final-state withdrawn">Candidate withdrew this application.</div>
          ` : ""}
          ${a.status==="hired" ? `
            <div class="final-state hired">Application closed · Hired</div>
          ` : ""}

          ${!["hired","unsuccessful","withdrawn","offer_accepted"].includes(a.status) ? `
            <button class="btn btn-bad btn-block" style="margin-top:10px" onclick="openMarkUnsuccessful('${a.id}')">Mark unsuccessful</button>
          ` : ""}

          <button class="btn btn-outline btn-block" style="margin-top:10px" onclick="viewApplicant('${a.id}')">View full applicant</button>
        </div>
      `).join('')}
    </div>
  `;
}


function openMarkUnsuccessful(id){
  const a = state.applicants.find(x=>String(x.id)===String(id));
  if(!a) return;

  openModal(`
    <h3>Mark candidate unsuccessful</h3>
    <p><strong>${a.applicantName || a.applicantEmail}</strong> · ${a.jobTitle}</p>
    <div class="notice">
      This will close the application and remove any outstanding interview invitation or pending offer.
    </div>
    <label>Internal note / reason (optional)</label>
    <textarea id="unsuccessfulNote" placeholder="Optional note for the Buisder application history"></textarea>
    <button class="btn btn-bad btn-block" style="margin-top:12px" onclick="markUnsuccessful('${a.id}')">Confirm unsuccessful</button>
  `);
}

async function markUnsuccessful(id){
  const note = document.getElementById("unsuccessfulNote")?.value.trim() || "";
  try{
    await api(`/api/applications/${id}/status`, {
      method:"POST",
      body:{action:"mark_unsuccessful", note}
    });
    closeModal();
    await loadBootstrap();
    render();
    toast("Application marked unsuccessful");
  }catch(e){ toast(e.message); }
}

function openOffer(id){
  const a = state.applicants.find(x=>String(x.id)===String(id));
  if(!a) return;

  if(!["interview_completed","offer_made","offer_declined"].includes(a.status)){
    toast("Complete the interview before making an offer");
    return;
  }

  openModal(`
    <h3>${a.offerStatus ? "Update job offer" : "Make job offer"}</h3>
    <p>${a.applicantName || a.applicantEmail} · ${a.jobTitle}</p>

    <label>Role / position</label>
    <input id="offerRoleTitle" value="${a.offerRoleTitle || a.jobTitle || ""}" placeholder="e.g. Retail Assistant">

    <label>Pay</label>
    <input id="offerPay" value="${a.offerPay || ""}" placeholder="e.g. €14.50 per hour">

    <label>Start date</label>
    <input id="offerStartDate" type="date" value="${a.offerStartDate || ""}">

    <label>Message to candidate</label>
    <textarea id="offerMessage" placeholder="Welcome message or important offer details">${a.offerMessage || ""}</textarea>

    <div class="notice">
      The candidate will see the offer in Buisder and can accept or decline it.
    </div>

    <button class="btn btn-good btn-block" style="margin-top:12px" onclick="sendOffer('${a.id}')">
      ${a.offerStatus ? "Send updated offer" : "Send job offer"}
    </button>
  `);
}

async function sendOffer(id){
  const roleTitle = document.getElementById("offerRoleTitle").value.trim();
  const pay = document.getElementById("offerPay").value.trim();
  const startDate = document.getElementById("offerStartDate").value;
  const message = document.getElementById("offerMessage").value.trim();

  if(!roleTitle){ toast("Add the role title"); return; }
  if(!pay){ toast("Add the pay"); return; }
  if(!startDate){ toast("Choose a start date"); return; }

  try{
    await api(`/api/applications/${id}/offer`, {
      method:"POST",
      body:{roleTitle, pay, startDate, message}
    });
    closeModal();
    await loadBootstrap();
    render();
    toast("Job offer sent");
  }catch(e){ toast(e.message); }
}

async function markHired(id){
  if(!confirm("Mark this candidate as hired?")) return;
  try{
    await api(`/api/applications/${id}/status`, {
      method:"POST",
      body:{action:"mark_hired"}
    });
    await loadBootstrap();
    render();
    toast("Candidate marked as hired");
  }catch(e){ toast(e.message); }
}

async function setShortlist(id, shouldShortlist){
  try{
    await api(`/api/applications/${id}/status`, {
      method:"POST",
      body:{action: shouldShortlist ? "shortlist" : "remove_shortlist"}
    });
    await loadBootstrap();
    render();
    toast(shouldShortlist ? "Candidate shortlisted" : "Candidate moved back to Applied");
  }catch(e){ toast(e.message); }
}

async function markInterviewCompleted(id){
  if(!confirm("Mark this interview as completed?")) return;
  try{
    await api(`/api/applications/${id}/status`, {
      method:"POST",
      body:{action:"interview_completed"}
    });
    await loadBootstrap();
    render();
    toast("Interview marked completed");
  }catch(e){ toast(e.message); }
}

async function sendInlineInterviewInvite(id){
  const date = document.getElementById(`ivDate-${id}`).value;
  const time = document.getElementById(`ivTime-${id}`).value;
  const place = document.getElementById(`ivPlace-${id}`).value.trim();
  const message = document.getElementById(`ivMessage-${id}`).value.trim();

  if(!date){ toast("Choose an interview date"); return; }
  if(!time){ toast("Choose an interview time"); return; }
  if(!place){ toast("Add an interview place or meeting method"); return; }

  try{
    await api(`/api/applications/${id}/invite`, {
      method:"POST",
      body:{ interviewAt:`${date}T${time}`, interviewLocation:place, interviewMessage:message }
    });
    await loadBootstrap();
    render();
    toast("Interview invitation sent to job seeker");
  }catch(e){ toast(e.message); }
}

  openModal(`
    ${a.applicantPhoto ? `<div class="jobseeker-photo"><img src="${a.applicantPhoto}" alt="Applicant photo"></div>` : `<div class="jobseeker-photo">${(a.applicantName || a.applicantEmail || "U").slice(0,1).toUpperCase()}</div>`}
    <h3>${a.applicantName || a.applicantEmail}</h3>
    <p>Applied to ${a.jobTitle}</p>
    <div style="margin-bottom:8px"><span class="pill ${applicationStatusClass(a)}">${applicationStatusLabel(a)}</span></div>
    ${renderWorkflowSteps(a)}
    <div class="title-row"><h2>Application timeline</h2><span>History</span></div>
    ${renderApplicationTimeline(a, "employer")}
    <p>${a.applicantLocation || "Location not set"} · ${a.applicantAvailability || "Availability not set"}</p>
    <div class="chips"><span class="chip">${a.applicantSkills || "No skills listed"}</span></div>
    <p>Contact: ${a.applicantEmail}</p>
    ${a.applicantCvUrl
      ? `<a class="btn btn-outline btn-block" href="${a.applicantCvUrl}" target="_blank" rel="noopener">Open ${a.applicantCvFilename || "candidate CV"}</a>`
