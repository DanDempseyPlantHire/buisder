    <div class="safety-actions">
      <button class="btn btn-outline" style="color:var(--ink);border-color:var(--line-light)" onclick="openReport('applicant','${a.applicantId}',{applicationId:'${a.id}',jobId:'${a.jobId}'})">Report applicant</button>
      <button class="btn btn-bad" onclick="blockUser('${a.applicantId}','${a.applicantName || "this applicant"}')">Block applicant</button>
    </div>

    ${a.interviewAt ? `
      <div class="interview-box ${a.interviewStatus==="declined" ? "declined" : (a.interviewStatus==="accepted" ? "" : "pending")}">
        <strong>${interviewStatusLabel(a)}</strong>
        <div style="margin-top:6px"><strong>Date & time:</strong> ${formatInterview(a.interviewAt)}</div>
        ${a.interviewLocation ? `<div style="margin-top:4px"><strong>Where:</strong> ${a.interviewLocation}</div>` : ""}
        ${a.interviewMessage ? `<div style="margin-top:4px"><strong>Message:</strong> ${a.interviewMessage}</div>` : ""}
      </div>
    ` : ""}

    ${["applied","shortlisted"].includes(a.status) ? `
      <button class="btn ${a.status==="shortlisted" ? "btn-outline" : "btn-good"} btn-block" style="margin-bottom:8px"
        onclick="closeModal(); setShortlist('${a.id}', ${a.status==="shortlisted" ? "false" : "true"})">
        ${a.status==="shortlisted" ? "Remove from shortlist" : "Shortlist candidate"}
      </button>
    ` : ""}
    ${["shortlisted","interview_invited","interview_accepted","interview_declined"].includes(a.status) ? `
      <button class="btn btn-dark btn-block" onclick="openInterviewInvite('${a.id}')">${a.interviewAt ? "Reschedule interview" : "Invite to interview"}</button>
    ` : ""}
    ${a.status==="interview_accepted" ? `
      <button class="btn btn-good btn-block" style="margin-top:8px" onclick="closeModal(); markInterviewCompleted('${a.id}')">Mark interview completed</button>
    ` : ""}
  `);
}

function openInterviewInvite(id){
  const a = state.applicants.find(x=>String(x.id)===String(id));
  if(!a) return;

  const existingAt = a.interviewAt || "";
  const existingLocation = a.interviewLocation || "";
  const existingMessage = a.interviewMessage || "";

  openModal(`
    <h3>${a.interviewAt ? "Reschedule interview" : "Invite to interview"}</h3>
    <p>${a.applicantName || a.applicantEmail} · ${a.jobTitle}</p>

    <label>Date and time</label>
    <input id="interviewAt" type="datetime-local" value="${existingAt}">

    <label>Location or meeting method</label>
    <input id="interviewLocation" value="${existingLocation}" placeholder="e.g. Cork City store, phone call, Teams">

    <label>Message to candidate</label>
    <textarea id="interviewMessage" placeholder="e.g. Please ask for Sarah at reception.">${existingMessage}</textarea>

    <div class="notice">
      The job seeker will see a new interview notification in Buisder with the proposed date, time and location. They can accept or decline it.
    </div>

    <button class="btn btn-dark btn-block" style="margin-top:12px" onclick="sendInterviewInvite('${a.id}')">
      ${a.interviewAt ? "Update interview invitation" : "Send interview invitation"}
    </button>
  `);
}

async function sendInterviewInvite(id){
  const interviewAt = document.getElementById("interviewAt").value;
  if(!interviewAt){ toast("Choose an interview date and time"); return; }

  const body = {
    interviewAt,
    interviewLocation: document.getElementById("interviewLocation").value,
    interviewMessage: document.getElementById("interviewMessage").value
  };

  try{
    await api(`/api/applications/${id}/invite`, {method:"POST", body});
    closeModal();
    await loadBootstrap();
    render();
    toast("Interview invitation sent");
  } catch(e){ toast(e.message); }
}

    <div class="section-pad">
      <div class="title-row"><h2>Business profile</h2><span>${businessVerificationLabel(status)}</span></div>

      <div class="form-card">
        ${(p.logo_url || p.logo_data)
          ? `<div class="business-logo"><img src="${p.logo_url || p.logo_data}" alt="Business profile image"></div>`
          : `<div class="business-logo">${businessInitial()}</div>`}

        <label>Business profile photo / logo</label>
        <input id="blogo" type="file" accept="image/*">
        <div class="geo-status">This image will appear on your business profile and job listings.</div>

        <label>Contact name</label>
        <input id="bname" value="${state.user.name || ""}">

        <label>Business / trading name</label>
        <input id="bcompany" value="${p.company_name || ""}" placeholder="e.g. Harbour Sports">

        <label>Legal business name</label>
        <input id="blegalname" value="${p.legal_name || ""}" placeholder="e.g. Harbour Sports Limited">

        <label>Business phone</label>
        <input id="bphone" type="tel" value="${p.phone || ""}" placeholder="Business contact number">

        <label>Website</label>
        <input id="bwebsite" type="url" value="${p.website || ""}" placeholder="https://...">

        <label>Location</label>
        <input id="blocation" value="${p.location || ""}" placeholder="e.g. Cork">

        <label>About the business</label>
        <textarea id="bdescription" placeholder="A short intro candidates will see">${p.description || ""}</textarea>

        <div class="verification-card ${businessVerificationClass(status)}">
          <strong>${businessVerificationLabel(status)}</strong>
          <div style="margin-top:5px;font-size:12px;line-height:1.4">
            ${status==="verified"
              ? "Your account has been manually verified. Candidates will see a verified badge."
              : status==="pending"
                ? "Your details are waiting for manual review. You can still update your profile."
                : status==="rejected"
                  ? `The verification request needs attention.${p.verification_note ? " " + p.verification_note : ""}`
                  : "Complete the required business details, save them, then submit for verification."}

        </div>

        <button class="btn btn-dark btn-block" onclick="saveBusinessProfile()">Save business profile</button>

  `;

async function saveBusinessProfile(){
  try{
    const logoInput = document.getElementById("blogo");
    if(logoInput && logoInput.files && logoInput.files[0]){
      toast("Uploading business image…");
      const blob = await prepareProfilePhotoFile(logoInput.files[0]);
      await uploadR2File("business-logo", blob, "business-logo.jpg");
    }

    const body = {
      name: document.getElementById("bname").value || "",
      companyName: document.getElementById("bcompany").value || "",
      legalName: document.getElementById("blegalname").value || "",
      registrationNumber: document.getElementById("breg").value || "",
      phone: document.getElementById("bphone").value || "",
      website: document.getElementById("bwebsite").value || "",
      location: document.getElementById("blocation").value || "",
      description: document.getElementById("bdescription").value || ""
    };

    await api("/api/profile", {method:"PUT", body});
    await loadBootstrap();
    toast("Business profile saved");
    render();
  } catch(e){ toast(e.message); }
}

function openModal(html){
  document.getElementById("modalContent").innerHTML = html;
  document.getElementById("modal").classList.remove("hidden");
}
function closeModal(e){
  if(!e || e.target.id==="modal"){ document.getElementById("modal").classList.add("hidden"); }
}

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  setTimeout(()=>t.classList.add("hidden"), 1800);
}

function setupSwipe(){
  const card = document.getElementById("swipeCard");
  if(!card) return;
  const like = document.getElementById("likeBadge");
  const nope = document.getElementById("nopeBadge");
  let startX = 0, currentX = 0, dragging = false;

  const pointerDown = (clientX) => {
    dragging = true;
    startX = clientX;
    currentX = 0;
    card.style.transition = "none";
  };

  const pointerMove = (clientX) => {
    if(!dragging) return;
    currentX = clientX - startX;
    const rotate = currentX * 0.06;
    card.style.transform = `translateX(${currentX}px) rotate(${rotate}deg)`;
    if(currentX > 0){
      like.style.opacity = Math.min(currentX/80, 1);
      nope.style.opacity = 0;
    } else {
      nope.style.opacity = Math.min(Math.abs(currentX)/80, 1);
      like.style.opacity = 0;
    }
  };

  const pointerUp = () => {
    if(!dragging) return;
    dragging = false;
    card.style.transition = "transform .25s ease, opacity .25s ease";
    if(currentX > 120){
      card.style.transform = "translateX(120%) rotate(18deg)";
      like.style.opacity = 1;
      setTimeout(()=>acceptCurrent(), 180);
      return;
    }
    if(currentX < -120){
      card.style.transform = "translateX(-120%) rotate(-18deg)";
      nope.style.opacity = 1;
      setTimeout(()=>skipCurrent(), 180);
      return;
    }
    card.style.transform = "";
    like.style.opacity = 0;
    nope.style.opacity = 0;
  };

  card.addEventListener("mousedown", e => pointerDown(e.clientX));
  window.addEventListener("mousemove", e => pointerMove(e.clientX));
  window.addEventListener("mouseup", pointerUp);

  card.addEventListener("touchstart", e => pointerDown(e.touches[0].clientX), {passive:true});
  card.addEventListener("touchmove", e => pointerMove(e.touches[0].clientX), {passive:true});
  card.addEventListener("touchend", pointerUp);
}

boot();
</script>
</body>
</html>
