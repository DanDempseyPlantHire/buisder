<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="Buisder - swipe-friendly job matching for young people. Apply to local jobs in seconds." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2210%22 fill=%22%237c3aed%22/><text x=%2250%25%22 y=%2262%25%22 font-size=%2258%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22900%22 text-anchor=%22middle%22>B</text></svg>" />
  <title>Buisder - Swipe Prototype</title>
  <style>
    :root{
      --ink:#181814;
      --panel:#211f19;
      --paper:#f5f2ea;
      --paper-dim:#eae5d8;
      --text:#181814;
      --muted:#8a8477;
      --muted-on-dark:#a39c8c;
      --line-dark:rgba(245,242,234,.14);
      --line-light:#ddd6c4;
      --accent:#c1531f;
      --accent-ink:#7a3512;
      --accent-tint:#f4e2d4;
      --good:#3d6b46;
      --good-tint:#e4ede2;
      --bad:#a63a2c;
      --bad-tint:#f4e2dd;
      --radius:10px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--paper)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{
      width:min(100%,430px);
      min-height:100vh;
      margin:0 auto;
      position:relative;
      background:var(--ink);
      overflow:hidden;
    }
    .topbar{
      position:sticky;top:0;z-index:30;
      padding:14px 16px 10px;
      background:var(--ink);
      border-bottom:1px solid var(--line-dark);
    }
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
    .logo{
      width:36px;height:36px;border-radius:8px;background:var(--accent);
      display:grid;place-items:center;font-weight:700;color:var(--paper)
    }
    .subtle{font-size:12px;color:var(--muted-on-dark)}
    .modepill{
      display:flex;background:transparent;padding:3px;border-radius:10px;border:1px solid var(--line-dark)
    }
    .modepill button{
      border:0;background:transparent;color:var(--muted-on-dark);padding:8px 10px;border-radius:7px;font-size:12px;font-weight:600
    }
    .modepill button.active{background:var(--paper);color:var(--ink)}
    main{padding-bottom:92px}
    .hidden{display:none!important}
    .hero{
      margin:16px;background:var(--accent);
      border-radius:12px;padding:20px
    }
    .hero h1{margin:0 0 10px;font-size:26px;line-height:1.1;letter-spacing:-.02em;font-weight:700}
    .hero p{margin:0;color:var(--accent-tint);font-size:14px;line-height:1.5}
    .cta-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
    .btn{
      border:0;border-radius:8px;padding:12px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px
    }
    .btn-dark{background:var(--panel);color:var(--paper);border:1px solid var(--line-dark)}
    .btn-light{background:var(--paper);color:var(--ink)}
    .btn-soft{background:rgba(245,242,234,.14);color:var(--paper)}
    .btn-good{background:var(--good-tint);color:var(--good)}
    .btn-bad{background:var(--bad-tint);color:var(--bad)}
    .btn-outline{background:transparent;border:1px solid var(--line-dark);color:var(--paper)}
    .btn-block{width:100%}
    .section-pad{padding:0 16px}
    .title-row{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:18px 0 10px}
    .title-row h2{margin:0;font-size:17px;letter-spacing:-.01em;font-weight:700}
    .title-row span{font-size:12px;color:var(--muted-on-dark)}
    .card{
      background:var(--paper);color:var(--text);border-radius:var(--radius);padding:16px;border:1px solid var(--line-light)
    }
    .card.dark{
      background:var(--panel);color:var(--paper);border:1px solid var(--line-dark)
    }
    .small{font-size:12px;color:var(--muted)}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
    .chip{
      padding:7px 10px;border-radius:8px;background:var(--paper-dim);font-size:12px;font-weight:600;color:#4b4638
    }
    .chip.dark{background:rgba(245,242,234,.1);color:var(--paper);border:1px solid var(--line-dark)}
    .chip.good{background:var(--good-tint);color:var(--good)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .stat{
      background:var(--panel);border:1px solid var(--line-dark);border-radius:10px;padding:14px;text-align:center
    }
    .stat strong{display:block;font-size:19px;font-weight:700}
    .stat span{font-size:11px;color:var(--muted-on-dark)}
    .feed-wrap{padding:10px 16px 110px}
    .feed-intro{
      display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px
    }
    .feed-intro h2{margin:0;font-size:17px;font-weight:700}
    .feed-intro .hint{font-size:12px;color:var(--muted-on-dark)}
    .feed{
      position:relative;
      min-height:72vh;
    }
    .job-card{
      position:relative;
      width:100%;
      min-height:72vh;
      border-radius:12px;
      overflow:hidden;
      border:1px solid var(--line-light);
      background:var(--paper);
      color:var(--ink);
      touch-action:pan-y;
      user-select:none;
      transition:transform .25s ease, opacity .25s ease;
    }
    .job-image{
      min-height:30vh;
      padding:18px;
      color:var(--paper);
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      background:var(--ink);
      border-bottom:1px solid var(--line-dark);
    }
    .job-badge{
      display:inline-flex;align-self:flex-start;
      background:transparent;
      border:1px solid var(--line-dark);
      color:var(--paper);padding:6px 10px;border-radius:7px;font-size:11px;font-weight:600;
    }
    .job-image h3{margin:10px 0 4px;font-size:26px;line-height:1.1;letter-spacing:-.01em;font-weight:700}
    .job-image p{margin:0;color:var(--muted-on-dark)}
    .job-body{padding:18px}
    .grid{
      display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0
    }
    .metric{
      border:1px solid var(--line-light);
      border-radius:8px;
      padding:12px;
      background:var(--paper-dim)
    }
    .metric small{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
    .metric strong{font-size:14px}
    .why{
      background:var(--accent-tint);border-radius:10px;padding:13px;font-size:13px;line-height:1.5;color:var(--accent-ink)
    }
    .swipe-overlay{
      position:absolute;top:18px;z-index:2;padding:9px 14px;border-radius:7px;font-size:14px;
      font-weight:700;letter-spacing:.03em;opacity:0;transition:opacity .12s ease;
      border:2px solid transparent
    }
    .swipe-like{right:18px;background:var(--good-tint);color:var(--good);border-color:var(--good)}
    .swipe-nope{left:18px;background:var(--bad-tint);color:var(--bad);border-color:var(--bad)}
    .swipe-actions{
      display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px
    }
    .big-action{padding:14px 12px;border-radius:8px;border:0;font-weight:600}
    .skip{background:var(--bad-tint);color:var(--bad)}
    .details{background:var(--ink);color:var(--paper)}
    .accept{background:var(--good-tint);color:var(--good)}
    .feed-progress{
      display:flex;gap:6px;margin:12px 0 4px
    }
    .feed-progress span{
      flex:1;height:3px;border-radius:3px;background:var(--line-dark)
    }
    .feed-progress span.active{background:var(--accent)}
    .info-note{
      margin-top:12px;font-size:12px;color:var(--muted-on-dark);line-height:1.4
    }
    .list-card{margin-bottom:12px}
    .app-item{
      display:flex;align-items:center;justify-content:space-between;gap:12px
    }
    .pill{
      padding:6px 10px;border-radius:7px;font-size:11px;font-weight:600
    }
    .pill.good{background:var(--good-tint);color:var(--good)}
    .pill.soft{background:var(--accent-tint);color:var(--accent-ink)}
    .bottomnav{
      position:fixed;bottom:0;left:50%;transform:translateX(-50%);
      width:min(100%,430px);
      background:var(--ink);
      border-top:1px solid var(--line-dark);
      padding:8px 8px calc(8px + env(safe-area-inset-bottom));
      display:grid;grid-template-columns:repeat(4,1fr);z-index:40
    }
    .bottomnav button{
      border:0;border-top:2px solid transparent;background:transparent;color:var(--muted-on-dark);padding:10px 4px 6px;font-size:12px;font-weight:600
    }
    .bottomnav button.active{color:var(--paper);border-top-color:var(--accent)}
    .modal{
      position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:70
    }
    .sheet{
      width:min(100%,430px);background:var(--paper);color:var(--ink);border-radius:14px 14px 0 0;padding:20px;max-height:84vh;overflow:auto;border-top:1px solid var(--line-light)
    }
    .handle{width:40px;height:4px;border-radius:3px;background:var(--line-light);margin:0 auto 16px}
    .sheet h3{margin:0 0 8px;font-size:22px;letter-spacing:-.01em;font-weight:700}
    .sheet p{color:#565244;line-height:1.5}
    .toast{
      position:fixed;left:50%;transform:translateX(-50%);bottom:98px;background:var(--ink);color:var(--paper);
      border-radius:8px;padding:11px 15px;font-size:12px;font-weight:600;border:1px solid var(--line-dark);z-index:90
    }
    .empty{
      padding:30px 18px;text-align:center
    }
    .form-card{
      background:var(--paper);color:var(--ink);border-radius:10px;padding:16px;border:1px solid var(--line-light)
    }
    label{display:block;font-size:12px;font-weight:600;margin:12px 0 6px;color:#4b4638}
    input,select,textarea{
      width:100%;border:1px solid var(--line-light);border-radius:8px;padding:12px;background:#fff;color:var(--ink);outline:none
    }
    input:focus,select:focus,textarea:focus{border-color:var(--accent)}
    .notice{
      background:var(--paper-dim);border-radius:8px;padding:12px;font-size:12px;line-height:1.5;color:#565244;margin-top:12px
    }
    .interview-alert{
      background:var(--accent-tint);color:var(--accent-ink);border:1px solid #d7b19b;
      border-radius:10px;padding:14px;margin-bottom:12px
    }
    .interview-alert strong{display:block;margin-bottom:4px}
    .notify-btn{margin-top:10px;background:#fff;color:#111827;border:0;border-radius:12px;padding:10px 12px;font-weight:900}
    .interview-box{
      background:var(--good-tint);color:#294d30;border:1px solid #b8ccb9;
      border-radius:10px;padding:13px;margin:12px 0
    }
    .interview-box.pending{background:var(--accent-tint);color:var(--accent-ink);border-color:#d7b19b}
    .interview-box.declined{background:var(--bad-tint);color:var(--bad);border-color:#d9aaa1}
    .new-dot{
      display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;
      border-radius:9px;background:var(--accent);color:var(--paper);font-size:10px;margin-left:4px;padding:0 5px
    }
    @media (min-width:700px){
      body{padding:24px 0}
      .app{border-radius:14px;border:1px solid var(--line-dark);min-height:calc(100vh - 48px)}
      .bottomnav{bottom:24px;border-radius:0 0 14px 14px}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar hidden" id="topbar">
    <div class="row">
      <div>
        <div class="brand"><div class="logo">B</div><div>Buisder</div></div>
        <div class="subtle" id="modeLabel">Swipe-friendly jobs for young people</div>
      </div>
      <button class="btn btn-outline" onclick="doLogout()">Log out</button>
    </div>
  </header>

  <main id="content"><div style="padding:60px 16px;text-align:center;color:var(--muted-on-dark)">Loading…</div></main>
  <nav class="bottomnav hidden" id="bottomnav"></nav>
</div>

<div id="modal" class="modal hidden" onclick="closeModal(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="handle"></div>
    <div id="modalContent"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
let state = {
  user:null,
  mode:null,
  tab:null,
  profile:{},
  jobs:[],
  applications:[],
  skipped:[],
  lastAction:null,
  postedJobs:[],
  applicants:[],
  authMode:"login",
  authRole:"jobseeker",
  authError:""
};

function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }

function formatInterview(value){
  if(!value) return "";
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return value.replace("T"," ");
  return d.toLocaleString("en-IE", {
    weekday:"short", day:"numeric", month:"short", year:"numeric",
    hour:"2-digit", minute:"2-digit"
  });
}

function interviewStatusLabel(a){
  if(a.interviewStatus==="accepted" || a.status==="interview_accepted") return "Interview confirmed";
  if(a.interviewStatus==="declined" || a.status==="interview_declined") return "Interview declined";
  if(a.interviewAt) return "Interview invited";
  return cap(a.status);
}

function unreadInterviewCount(){
  return state.applications.filter(a => a.interviewAt && !a.inviteSeenAt && (a.interviewStatus==="pending" || a.status==="invited")).length;
}

const notifiedInterviewIds = new Set();

async function enableBrowserNotifications(){
  if (!("Notification" in window)) { toast("Browser notifications are not supported on this device"); return; }
  const permission = await Notification.requestPermission();
  if(permission === "granted"){
    toast("Interview notifications enabled");
    notifyUnseenInterviews();
  } else {
    toast("Notifications were not enabled");
  }
}

function notifyUnseenInterviews(){
  if(state.mode !== "jobseeker" || !("Notification" in window) || Notification.permission !== "granted") return;
  for(const a of state.applications){
    if(a.interviewAt && !a.inviteSeenAt && !notifiedInterviewIds.has(a.id)){
      notifiedInterviewIds.add(a.id);
      new Notification("New interview invitation", {
        body: `${a.company || "An employer"} invited you to interview on ${formatInterview(a.interviewAt)}${a.interviewLocation ? " at " + a.interviewLocation : ""}.`
      });
    }
  }
}

async function api(path, opts = {}){
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: opts.body ? { "Content-Type":"application/json" } : undefined,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    credentials:"include"
  });
  let data = null;
  try{ data = await res.json(); } catch(e){}
  if(!res.ok){ throw new Error((data && data.error) || "Something went wrong"); }
  return data;
}

async function loadBootstrap(){
  const data = await api("/api/bootstrap");
  state.user = data.user;
  if(!data.user) return;
  state.mode = data.user.role;
  const validTab = state.mode==="jobseeker"
    ? ["feed","applications","profile"].includes(state.tab)
    : ["home","post","applicants","profile"].includes(state.tab);
  if(!validTab) state.tab = state.mode==="jobseeker" ? "feed" : "home";
  state.profile = data.profile || {};
  if(state.mode==="jobseeker"){
    state.jobs = data.jobs || [];
    state.applications = data.applications || [];
    state.skipped = data.skipped || [];
    setTimeout(notifyUnseenInterviews, 50);
  } else {
    state.postedJobs = data.postedJobs || [];
    state.applicants = data.applicants || [];
  }
}

async function boot(){
  try{ await loadBootstrap(); } catch(e){ state.user = null; }
  render();
  setInterval(async ()=>{
    if(!state.user) return;
    try{
      const before = unreadInterviewCount();
      await loadBootstrap();
      const after = unreadInterviewCount();
      if(after !== before) render();
      notifyUnseenInterviews();
    }catch(e){}
  }, 20000);
}

async function setTab(tab){
  state.tab = tab;
  render();
  if(tab==="applications" && state.mode==="jobseeker"){
    const unseen = state.applications.filter(a => a.interviewAt && !a.inviteSeenAt);
    for(const a of unseen){
      try{
        await api(`/api/applications/${a.id}/seen`, {method:"POST"});
        a.inviteSeenAt = new Date().toISOString();
      } catch(e){}
    }
    render();
  }
}

function renderAuth(){
  const errBox = state.authError ? `<div class="notice" style="color:var(--bad)">${state.authError}</div>` : "";
  if(state.authMode === "signup"){
    return `
      <div class="hero">
        <h1>Create your account</h1>
        <p>Set up Buisder as a job seeker or an employer.</p>
      </div>
      <div class="section-pad">
        <div class="form-card">
          <label>I am a</label>
          <div class="modepill" style="margin:0 0 4px">
            <button type="button" class="${state.authRole==='jobseeker'?'active':''}" onclick="state.authRole='jobseeker';render()">Job seeker</button>
            <button type="button" class="${state.authRole==='employer'?'active':''}" onclick="state.authRole='employer';render()">Employer</button>
          </div>
          <label>${state.authRole==='employer' ? 'Business name' : 'First name'}</label>
          <input id="authName" placeholder="${state.authRole==='employer' ? 'Your Business' : 'Alex'}">
          <label>Email</label>
          <input id="authEmail" type="email" placeholder="you@example.com">
          <label>Password</label>
          <input id="authPassword" type="password" placeholder="At least 8 characters">
          ${errBox}
          <button class="btn btn-dark btn-block" style="margin-top:12px" onclick="doSignup()">Create account</button>
          <div class="small" style="margin-top:12px;text-align:center">Already have an account? <a href="#" onclick="state.authMode='login';state.authError='';render();return false" style="color:var(--accent-ink)">Log in</a></div>
        </div>
      </div>
    `;
  }
  return `
    <div class="hero">
      <h1>Welcome back</h1>
      <p>Log in to your Buisder account.</p>
    </div>
    <div class="section-pad">
      <div class="form-card">
        <label>Email</label>
        <input id="authEmail" type="email" placeholder="you@example.com">
        <label>Password</label>
        <input id="authPassword" type="password" placeholder="Your password">
        ${errBox}
        <button class="btn btn-dark btn-block" style="margin-top:12px" onclick="doLogin()">Log in</button>
        <div class="small" style="margin-top:12px;text-align:center">New here? <a href="#" onclick="state.authMode='signup';state.authError='';render();return false" style="color:var(--accent-ink)">Create an account</a></div>
      </div>
    </div>
  `;
}

async function doSignup(){
  const name = document.getElementById("authName").value.trim();
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  try{
    await api("/api/auth/signup", {method:"POST", body:{name, email, password, role:state.authRole}});
    state.authError = "";
    await loadBootstrap();
    render();
  } catch(e){ state.authError = e.message; render(); }
}

async function doLogin(){
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  try{
    await api("/api/auth/login", {method:"POST", body:{email, password}});
    state.authError = "";
    await loadBootstrap();
    render();
  } catch(e){ state.authError = e.message; render(); }
}

async function doLogout(){
  try{ await api("/api/auth/logout", {method:"POST"}); } catch(e){}
  state.user = null;
  state.tab = null;
  state.authMode = "login";
  render();
}

function renderNav(){
  const nav = document.getElementById("bottomnav");
  const unread = state.mode==="jobseeker" ? unreadInterviewCount() : 0;
  const items = state.mode==="jobseeker"
    ? [["feed","Jobs"],["applications",`Applied${unread ? ` (${unread})` : ""}`],["profile","Profile"]]
    : [["home","Dashboard"],["post","Post job"],["applicants","Applicants"],["profile","Business"]];
  nav.style.gridTemplateColumns = `repeat(${items.length},1fr)`;
  nav.innerHTML = items.map(([key,label]) => `
    <button class="${state.tab===key?'active':''}" onclick="setTab('${key}')">${label}</button>
  `).join("");
}

function render(){
  const topbar = document.getElementById("topbar");
  const nav = document.getElementById("bottomnav");
  if(!state.user){
    topbar.classList.add("hidden");
    nav.classList.add("hidden");
    document.getElementById("content").innerHTML = renderAuth();
    return;
  }
  topbar.classList.remove("hidden");
  nav.classList.remove("hidden");
  document.getElementById("modeLabel").textContent = state.mode==="jobseeker" ? "Job seeker account" : "Employer account";
  renderNav();
  document.getElementById("content").innerHTML = state.mode==="jobseeker" ? renderJobseeker() : renderEmployer();
  if(state.mode==="jobseeker" && state.tab==="feed"){ setupSwipe(); }
}

function currentFeedJobs(){
  return state.jobs.filter(j => !state.applications.some(a=>a.jobId===j.id) && !state.skipped.includes(j.id));
}

function renderJobseeker(){
  if(state.tab==="applications") return renderApplied();
  if(state.tab==="profile") return renderProfile();
  return renderFeed();
}

function renderFeed(){
  const jobs = currentFeedJobs();
  const current = jobs[0];
  const progress = Math.min(state.jobs.length, 5);
  return `
    <div class="feed-wrap">
      ${unreadInterviewCount() ? `
        <div class="interview-alert">
          <strong>🔔 ${unreadInterviewCount()} new interview ${unreadInterviewCount()===1 ? "invitation" : "invitations"}</strong>
          An employer has proposed a date, time and place. Review it and accept or decline.
          <button class="btn btn-dark btn-block" style="margin-top:10px" onclick="setTab('applications')">View interview invitation</button>
          ${("Notification" in window && Notification.permission !== "granted") ? `<button class="notify-btn" onclick="enableBrowserNotifications()">Enable browser notifications</button>` : ""}
        </div>
      ` : ""}
      <div class="feed-intro">
        <div>
          <h2>Swipe jobs</h2>
          <div class="hint">Right = apply · Left = skip</div>
        </div>
        <div style="display:flex;gap:8px">
          ${state.lastAction ? `<button class="btn btn-outline" onclick="undoLast()">Undo</button>` : ""}
          <button class="btn btn-outline" onclick="resetDecisions()">Reset</button>
        </div>
      </div>
      <div class="feed-progress">
        ${Array.from({length: Math.max(progress,1)}).map((_,i)=>`<span class="${i===0 && current ? 'active' : ''}"></span>`).join('')}

        current ? renderSwipeCard(current, jobs.length) : `
        <div class="card dark empty">
          <h3 style="margin:0 0 8px">You reached the end</h3>
          <p style="color:#cbd5e1">You have reviewed all current placeholder jobs. Reset the feed or go to Applied to see the jobs you liked.</p>
          <button class="btn btn-light btn-block" onclick="resetDecisions()">Reload jobs</button>
        </div>

    </div>
  `;
}

  return `

      <div class="job-image">
        <div class="job-badge">${industry}</div>
        <h3>${job.title}</h3>
        <p>${job.company || "Employer"} · ${job.location || "Location flexible"}</p>

      <div class="job-body">
        <div class="chips">
          <span class="chip good">No CV needed</span>
          <span class="chip">${job.experience || "No experience listed"}</span>

function showJob(id){
  const j = state.jobs.find(x=>String(x.id)===String(id));
  if(!j) return;
  openModal(`
    <h3>${j.title}</h3>
    <p><strong>${j.company || "Employer"}</strong> · ${j.location || "Location flexible"}</p>
    <div class="chips">
      <span class="chip good">Pay shown upfront</span>
      <span class="chip">${j.pay || "On request"}</span>
      <span class="chip">${j.hours || "Flexible"}</span>

async function acceptCurrent(){
  const jobs = currentFeedJobs();
  const current = jobs[0];
  if(!current) return;
  try{
    await api("/api/applications", {method:"POST", body:{jobId:current.id}});
    state.lastAction = {type:"applied", jobId:current.id};
    await loadBootstrap();
    toast("Application sent");
    render();
  } catch(e){ toast(e.message); }
}

async function skipCurrent(){
  const jobs = currentFeedJobs();
  const current = jobs[0];
  if(!current) return;
  try{
    await api("/api/skips", {method:"POST", body:{jobId:current.id}});
    state.lastAction = {type:"skipped", jobId:current.id};
    await loadBootstrap();
    toast("Job skipped");
    render();
  } catch(e){ toast(e.message); }
}

async function undoLast(){
  if(!state.lastAction) return;
  const { type, jobId } = state.lastAction;
  try{
    if(type === "skipped"){
      await api(`/api/skips/${jobId}`, {method:"DELETE"});
    } else if(type === "applied"){
      await api(`/api/applications/${jobId}`, {method:"DELETE"});
    }
    state.lastAction = null;
    await loadBootstrap();
    toast("Undone");
    render();
  } catch(e){ toast(e.message); }
}

async function resetDecisions(){
  try{
    await api("/api/reset", {method:"POST"});
    state.lastAction = null;
    await loadBootstrap();
    toast("Feed reset");
    render();
  } catch(e){ toast(e.message); }
}

async function respondToInterview(applicationId, response){
  const label = response==="accepted" ? "accept" : "decline";
  if(!confirm(`Are you sure you want to ${label} this interview invitation?`)) return;
  try{
    await api(`/api/applications/${applicationId}/respond`, {method:"POST", body:{response}});
    await loadBootstrap();
    render();
    toast(response==="accepted" ? "Interview confirmed" : "Interview declined");
  } catch(e){ toast(e.message); }
}

    about: document.getElementById("pabout").value,

    experience: document.getElementById("pexperience").value,

async function sendInlineInterviewInvite(id){
  const date = document.getElementById(`ivDate-${id}`).value;
  const time = document.getElementById(`ivTime-${id}`).value;
  const place = document.getElementById(`ivPlace-${id}`).value.trim();
  const message = document.getElementById(`ivMessage-${id}`).value.trim();

  if(!date){ toast("Choose an interview date"); return; }
  if(!time){ toast("Choose an interview time"); return; }
  if(!place){ toast("Add an interview place or meeting method"); return; }

  try{
    await api(`/api/applications/${id}/invite`, {
      method:"POST",
      body:{ interviewAt:`${date}T${time}`, interviewLocation:place, interviewMessage:message }
    });
    await loadBootstrap();
    render();
    toast("Interview invitation sent to job seeker");
  }catch(e){ toast(e.message); }
}

  openModal(`

    <input id="interviewAt" type="datetime-local" value="${existingAt}">

    <label>Location or meeting method</label>
    <input id="interviewLocation" value="${existingLocation}" placeholder="e.g. Cork City store, phone call, Teams">

    <label>Message to candidate</label>
    <textarea id="interviewMessage" placeholder="e.g. Please ask for Sarah at reception.">${existingMessage}</textarea>

    <div class="notice">
      The job seeker will see a new interview notification in Buisder with the proposed date, time and location. They can accept or decline it.
    </div>

    <button class="btn btn-dark btn-block" style="margin-top:12px" onclick="sendInterviewInvite('${a.id}')">
      ${a.interviewAt ? "Update interview invitation" : "Send interview invitation"}
    </button>
  `);
}

async function sendInterviewInvite(id){
  const interviewAt = document.getElementById("interviewAt").value;
  if(!interviewAt){ toast("Choose an interview date and time"); return; }

  const body = {
    interviewAt,
    interviewLocation: document.getElementById("interviewLocation").value,
    interviewMessage: document.getElementById("interviewMessage").value
  };

  try{
    await api(`/api/applications/${id}/invite`, {method:"POST", body});
    closeModal();
    await loadBootstrap();
    render();
    toast("Interview invitation sent");
  } catch(e){ toast(e.message); }
}

function renderBusinessProfile(){
  const p = state.profile || {};
  return `
    <div class="section-pad">
      <div class="title-row"><h2>Business profile</h2><span>Account</span></div>
      <div class="form-card">
        <label>Contact name</label>
        <input id="bname" value="${state.user.name || ""}">
        <label>Business name</label>
        <input id="bcompany" value="${p.company_name || ""}">
        <label>Email</label>
        <input value="${state.user.email || ""}" disabled style="opacity:.6">
        <label>Location</label>
        <input id="blocation" value="${p.location || ""}" placeholder="e.g. Cork">
        <label>About the business</label>
        <textarea id="bdescription" placeholder="A short intro candidates will see">${p.description || ""}</textarea>
        <div class="notice"><strong>Note:</strong> a production version should verify employer identity before allowing posts into the swipe feed.</div>
        <button class="btn btn-dark btn-block" onclick="saveBusinessProfile()">Save</button>
      </div>
    </div>
  `;
}

async function saveBusinessProfile(){
  const body = {
    name: document.getElementById("bname").value || "",
    companyName: document.getElementById("bcompany").value || "",
    location: document.getElementById("blocation").value || "",
    description: document.getElementById("bdescription").value || ""
  };
  try{
    await api("/api/profile", {method:"PUT", body});
    await loadBootstrap();
    toast("Business profile saved");
    render();
  } catch(e){ toast(e.message); }
}

function openModal(html){
  document.getElementById("modalContent").innerHTML = html;
  document.getElementById("modal").classList.remove("hidden");
}
function closeModal(e){
  if(!e || e.target.id==="modal"){ document.getElementById("modal").classList.add("hidden"); }
}

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  setTimeout(()=>t.classList.add("hidden"), 1800);
}

function setupSwipe(){
  const card = document.getElementById("swipeCard");
  if(!card) return;
  const like = document.getElementById("likeBadge");
  const nope = document.getElementById("nopeBadge");
  let startX = 0, currentX = 0, dragging = false;

  const pointerDown = (clientX) => {
    dragging = true;
    startX = clientX;
    currentX = 0;
    card.style.transition = "none";
  };

  const pointerMove = (clientX) => {
    if(!dragging) return;
    currentX = clientX - startX;
    const rotate = currentX * 0.06;
    card.style.transform = `translateX(${currentX}px) rotate(${rotate}deg)`;
    if(currentX > 0){
      like.style.opacity = Math.min(currentX/80, 1);
      nope.style.opacity = 0;
    } else {
      nope.style.opacity = Math.min(Math.abs(currentX)/80, 1);
      like.style.opacity = 0;
    }
  };

  const pointerUp = () => {
    if(!dragging) return;
    dragging = false;
    card.style.transition = "transform .25s ease, opacity .25s ease";
    if(currentX > 120){
      card.style.transform = "translateX(120%) rotate(18deg)";
      like.style.opacity = 1;
      setTimeout(()=>acceptCurrent(), 180);
      return;
    }
    if(currentX < -120){
      card.style.transform = "translateX(-120%) rotate(-18deg)";
      nope.style.opacity = 1;
      setTimeout(()=>skipCurrent(), 180);
      return;
    }
    card.style.transform = "";
    like.style.opacity = 0;
    nope.style.opacity = 0;
  };

  card.addEventListener("mousedown", e => pointerDown(e.clientX));
  window.addEventListener("mousemove", e => pointerMove(e.clientX));
  window.addEventListener("mouseup", pointerUp);

  card.addEventListener("touchstart", e => pointerDown(e.touches[0].clientX), {passive:true});
  card.addEventListener("touchmove", e => pointerMove(e.touches[0].clientX), {passive:true});
  card.addEventListener("touchend", pointerUp);
}

boot();
</script>
</body>
</html>
