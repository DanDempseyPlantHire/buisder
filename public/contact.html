<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070F">
  <meta name="robots" content="index,follow">
  <title>Contact us | Deas Jobs</title>
  <meta name="description" content="Contact the Deas Jobs team by email or phone for help with accounts, job listings or work experience opportunities.">
  <link rel="canonical" href="https://deasjobs.com/contact.html">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <style>
    :root{color-scheme:dark;--bg:#05070F;--card:#0B1530;--blue:#2D7BFF;--cyan:#00E5FF;--text:#EAF3FF;--muted:#B2C6DF}
    *{box-sizing:border-box;border-radius:0!important}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    a{color:var(--cyan)}a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
    .shell{max-width:780px;margin:auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 18px calc(env(safe-area-inset-bottom,0px) + 28px)}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid rgba(45,123,255,.4);padding:6px 0 15px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:750;color:var(--text);text-decoration:none}
    .brand img{width:43px;height:43px;object-fit:contain}
    .nav-link{border:1px solid var(--blue);padding:11px 13px;font-size:13px;font-weight:650;text-decoration:none;color:var(--text)}
    h1{font-size:clamp(30px,7vw,42px);letter-spacing:-.03em;margin:34px 0 10px}
    .intro{color:var(--muted);margin:0 0 24px;line-height:1.55}
    .contact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:30px}
    .contact-card{background:var(--card);border:1px solid rgba(45,123,255,.48);padding:20px;min-width:0}
    .contact-card h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:#A7CFFF;margin:0 0 12px}
    .contact-card a{overflow-wrap:anywhere;font-size:17px;font-weight:700;text-underline-offset:4px;line-height:1.5}
    .contact-card p{font-size:13px;color:var(--muted);margin:9px 0 0}
    footer{border-top:1px solid rgba(45,123,255,.35);padding-top:18px;display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
    footer a{color:var(--muted)}
    @media(max-width:560px){.contact-grid{grid-template-columns:1fr}h1{margin-top:24px}.contact-card{padding:16px}}
    .contact-nav{display:flex;align-items:center;gap:9px}.language-control{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.language-control select{min-height:40px;padding:6px;color:#EAF3FF;background:#111F3B;border:1px solid #2D7BFF;max-width:110px;font:inherit}.contact-nav .nav-link{white-space:nowrap}@media(max-width:440px){.language-control span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.language-control select{max-width:95px}}
  </style>
  <script defer src="/i18n.js"></script>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="/"><img src="/brand/deasjobs-logo.png" alt="" width="43" height="43"><span>Deas Jobs</span></a>
      <div class="contact-nav"><label class="language-control" for="contactLanguage"><span>Language</span><select id="contactLanguage" data-i18n-picker aria-label="Choose language" onchange="DeasI18n.setLanguage(this.value)"><option value="en" data-no-translate>English</option><option value="ga" data-no-translate>Gaeilge</option><option value="es" data-no-translate>Español</option></select></label><a class="nav-link" href="/">Home</a></div>
    </header>
    <main>
      <h1>Contact us</h1>
      <p class="intro">Need help with Deas Jobs? Contact our team directly.</p>
      <div class="contact-grid">
        <section class="contact-card"><h2>Email</h2><a href="mailto:deasjobscontact@gmail.com">deasjobscontact@gmail.com</a><p>Email our team</p></section>
        <section class="contact-card"><h2>Phone</h2><a href="tel:+353892153926">089 215 3926</a><p>Call us</p></section>
      </div>
    </main>
    <footer><a href="/">Home</a><a href="/jobs">Browse jobs</a><a href="/login.html">Log in</a><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a></footer>
  </div>
</body>
</html>
